function trip(r,h,m){
 const dep=key(h,m),base={route:r,h,m,dep,depMin:h*60+m,firstLink:LINKS[r]?.[dep]||''};
 if(r==='out-numazu'){
  const mishima=ARRIVALS.IZUNI_TO_MISHIMA[dep];if(!mishima)return {...base,invalid:true};
  const jr=firstPairAfter('JR_MISHIMA_TO_NUMAZU',toMin(mishima)+6);if(!jr)return {...base,mishima,invalid:true};
  return {...base,type:'transfer-out',mishima,jrDep:jr.d,arr:jr.a,wait:jr.dm-toMin(mishima),total:jr.am-base.depMin,jrLink:JR_LINKS[jr.d]||'',jrDest:JR_DEST[jr.d]||''};

}
function nextTrip(r){

   <div class="transfer-time">${t.wait}分</div><div class="transfer-box${warn}">乗り換え待ち ${t.wait}分</div>
   <div class="station-time">${t.izDep}</div><div class="station-box"><div class="station-name">三島 発</div><div class="station-note">伊豆箱根鉄道 駿豆線</div></div>
   <div class="line-time">${t.arr?`約${toMin(t.arr)-toMin(t.izDep)}分`:'--'}</div><div class="line-box">修善寺方面</div>
   <div class="station-time">${t.arr||'--:--'}</div><div class="station-box"><div class="station-name">伊豆仁田 着</div><div class="station-note">到着</div></div>
  </div><div class="detail-actions"><a class="detail-link jr${t.firstLink?'':' disabled'}" href="${t.firstLink||'#'}" target="_blank" rel="noopener">JRの詳細</a><a class="detail-link${t.secondLink?'':' disabled'}" href="${t.secondLink||'#'}" target="_blank" rel="noopener">駿豆線の詳細</a></div></div>`;
 }
 return '';
}
function buildSections(){
 const root=document.getElementById('sections');root.innerHTML='';
 for(const r of ROUTE_ORDER){
  const cfg=ROUTES[r],sec=document.createElement('section');sec.id='sec-'+r;sec.className='section';
  sec.innerHTML=`<div id="journey-${r}"></div><div id="grid-${r}"></div>`;
  root.appendChild(sec);buildGrid(r);
 }
}
function buildGrid(r){
 const cfg=ROUTES[r],grid=document.getElementById('grid-'+r),hours={};
 cfg.times.forEach(([h,m])=>(hours[h]??=[]).push(m));
 grid.className='hours-grid';
 grid.innerHTML=Object.keys(hours).map(Number).sort((a,b)=>a-b).map(h=>`<div class="hour"><div class="hour-label">${h}</div><div class="hour-line"></div><div class="minutes">${hours[h].map(m=>chipHtml(r,h,m)).join('')}</div></div>`).join('');
 grid.querySelectorAll('.chip[data-select="1"]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();selected[r]=el.dataset.time;renderRoute(r)}));
}
function chipHtml(r,h,m){
 const t=trip(r,h,m),tm=key(h,m),special=isSpecial(r,h,m),transfer=r==='out-numazu'||r==='home-numazu';
 const cls=`chip${transfer?' transfer-chip':''}${special?' special':''}`;
 if(transfer)return `<a href="#" class="${cls}" data-select="1" data-route="${r}" data-time="${tm}" data-min="${h*60+m}"><span class="minute">${pad(m)}</span></a>`;
 const href=t.firstLink||'#';return `<a href="${href}" class="${cls}" data-route="${r}" data-time="${tm}" data-min="${h*60+m}" target="_blank" rel="noopener"><span class="minute">${pad(m)}</span></a>`;
}
function renderRoute(r){
 document.querySelectorAll('.section').forEach(x=>x.classList.remove('visible'));document.getElementById('sec-'+r).classList.add('visible');
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active-out','active-home'));
 const tab=document.querySelector(`.tab[data-route="${r}"]`);tab.classList.add(ROUTES[r].kind==='home'?'active-home':'active-out');
 const t=currentTrip(r),j=document.getElementById('journey-'+r);j.innerHTML=(r==='out-numazu'||r==='home-numazu')?journeyHtml(t):'';
 document.querySelectorAll(`#grid-${r} .chip`).forEach(x=>x.classList.toggle('selected',selected[r]===x.dataset.time));
 currentRoute=r;localStorage.setItem('izunitta-route',r);refresh();
}
function refresh(){
 const n=nowMin();
 for(const r of ROUTE_ORDER){
  const nt=nextTrip(r);document.querySelectorAll(`#grid-${r} .chip`).forEach(x=>{const m=Number(x.dataset.min);x.classList.toggle('past',m<n);x.classList.toggle('next',!!nt&&x.dataset.time===nt.dep)});
  if((r==='out-numazu'||r==='home-numazu')&&!selected[r]){const j=document.getElementById('journey-'+r);if(j)j.innerHTML=journeyHtml(nt)}
 }
 const t=nextTrip(currentRoute);
 const times=document.getElementById('top-times'),cd=document.getElementById('countdown');
 if(!t){times.innerHTML='<div class="top-direct">本日の運行終了</div>';cd.textContent='--';return}
 cd.textContent=Math.max(0,t.depMin-n);
 times.innerHTML=`<div class="top-direct">${t.dep} 発 → ${t.arr||'--:--'} 着</div>`;
}
function tick(){const d=new Date();document.getElementById('clock').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
function hav(lat1,lon1,lat2,lon2){const R=6371,rad=x=>x*Math.PI/180,dlat=rad(lat2-lat1),dlon=rad(lon2-lon1),a=Math.sin(dlat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dlon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function gps(){
 if(!navigator.geolocation){document.getElementById('gps-text').textContent='GPS未対応';return}
 navigator.geolocation.getCurrentPosition(p=>{let best=null,dist=Infinity;for(const s of STATIONS){const d=hav(p.coords.latitude,p.coords.longitude,s.lat,s.lon);if(d<dist){best=s;dist=d}}document.getElementById('gps-dot').classList.add('on');document.getElementById('gps-text').textContent=best?`最寄り ${best.name}`:'GPS取得済み';if(!localStorage.getItem('izunitta-route')&&best)renderRoute(best.route)},()=>document.getElementById('gps-text').textContent='GPS取得失敗',{enableHighAccuracy:true,timeout:8000,maximumAge:60000})
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>renderRoute(b.dataset.route)));
buildSections();renderRoute(currentRoute);tick();gps();
setInterval(tick,1000);setInterval(refresh,30000);
</script>

<script>
(()=>{
 const SKIP=new Set(['SCRIPT','STYLE','SVG','PATH','META','LINK','TITLE','CANVAS']);
 const cache=new Map();let active=false;
 const TEST=document.createElement('canvas').getContext('2d');
 function splitRuns(text){const out=[];let cur='',kind='';for(const ch of text){const k=/[0-9:]/.test(ch)?'digit':(ch===' '||ch==='　'?'space':'ui');if(k==='space'){if(cur){out.push([kind,cur]);cur='';kind=''}out.push(['space',ch]);continue}if(k!==kind&&cur){out.push([kind,cur]);cur=''}kind=k;cur+=ch}if(cur)out.push([kind,cur]);return out}
 function uiMask(text){const key='u:'+text;if(cache.has(key))return cache.get(key);const family='"BIZ UDPGothic", Meiryo, sans-serif';let px=100;TEST.font=`700 ${px}px ${family}`;let m=TEST.measureText(text),h0=(m.actualBoundingBoxAscent||80)+(m.actualBoundingBoxDescent||18);px*=86/Math.max(1,h0);TEST.font=`700 ${px}px ${family}`;m=TEST.measureText(text);const asc=m.actualBoundingBoxAscent||px*.8,desc=m.actualBoundingBoxDescent||px*.18,left=Math.max(0,m.actualBoundingBoxLeft||0),right=Math.max(m.width,m.actualBoundingBoxRight||m.width),H=112,pad=6,W=Math.max(8,Math.ceil(left+right+pad*2)),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.font=`700 ${px}px ${family}`;x.textBaseline='alphabetic';x.fillStyle='#fff';x.fillText(text,pad+left,(H-(asc+desc))/2+asc);const r={mask:c.toDataURL('image/png'),w:W/H};cache.set(key,r);return r}
 function digitMask(text){const key='d:'+text;if(cache.has(key))return cache.get(key);const family='"Roboto Condensed", Arial Narrow, sans-serif';let px=100;TEST.font=`700 ${px}px ${family}`;let sm=TEST.measureText('0123456789'),h0=(sm.actualBoundingBoxAscent||75)+(sm.actualBoundingBoxDescent||18);px*=86/Math.max(1,h0);TEST.font=`700 ${px}px ${family}`;let cell=0,asc=0,desc=0;for(const d of '0123456789'){const m=TEST.measureText(d);cell=Math.max(cell,m.width);asc=Math.max(asc,m.actualBoundingBoxAscent||px*.75);desc=Math.max(desc,m.actualBoundingBoxDescent||px*.18)}cell=Math.ceil(cell+8);const colon=Math.ceil(cell*.42),H=112,W=Math.max(8,[...text].reduce((n,ch)=>n+(ch===':'?colon:cell),0)),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.font=`700 ${px}px ${family}`;x.textBaseline='alphabetic';x.textAlign='center';x.fillStyle='#fff';const y=(H-(asc+desc))/2+asc;let pos=0;for(const ch of text){const cw=ch===':'?colon:cell;x.fillText(ch,pos+cw/2,y);pos+=cw}const r={mask:c.toDataURL('image/png'),w:W/H};cache.set(key,r);return r}
 function maskSpan(kind,text){const r=kind==='digit'?digitMask(text):uiMask(text),s=document.createElement('span');s.className='img-run';s.style.setProperty('--mask',`url("${r.mask}")`);s.style.setProperty('--iw',`${r.w.toFixed(4)}em`);s.setAttribute('aria-hidden','true');return s}
 function convert(node){if(!node.parentElement||SKIP.has(node.parentElement.tagName)||node.parentElement.closest('.imgtext'))return;const text=node.nodeValue;if(!text||!text.trim())return;const wrap=document.createElement('span');wrap.className='imgtext';wrap.setAttribute('role','img');wrap.setAttribute('aria-label',text.trim());for(const [kind,run] of splitRuns(text)){if(kind==='space'){const sp=document.createElement('span');sp.className='img-space';sp.setAttribute('aria-hidden','true');wrap.appendChild(sp)}else wrap.appendChild(maskSpan(kind,run))}node.replaceWith(wrap)}
 function scan(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!n.parentElement||SKIP.has(n.parentElement.tagName)||n.parentElement.closest('.imgtext'))return NodeFilter.FILTER_REJECT;return n.nodeValue&&n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}}),nodes=[];while(w.nextNode())nodes.push(w.currentNode);nodes.forEach(convert)}
 function start(){if(active)return;active=true;scan(document.body);new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===Node.TEXT_NODE)convert(n);else if(n.nodeType===Node.ELEMENT_NODE&&!n.closest('.imgtext'))scan(n)}}).observe(document.body,{childList:true,subtree:true})}
 const ready=document.fonts?Promise.all([document.fonts.load('700 100px "BIZ UDPGothic"'),document.fonts.load('700 100px "Roboto Condensed"')]):Promise.resolve();Promise.race([ready,new Promise(r=>setTimeout(r,1600))]).then(start);
})();
