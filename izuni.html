<style>
:root{--bg:#0d1017;--surface:#171b26;--surface2:#202638;--line:#30384f;--text:#edf1f7;--muted:#929bb4;--out:#72d28a;--home:#62c8f2;--orange:#ff6b35;--purple:#d5a1ed;--yellow:#ffd35a;--danger:#ff8d8d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:14px;padding-bottom:34px}button,a{font:inherit}header{position:sticky;top:0;z-index:50;background:rgba(13,16,23,.96);backdrop-filter:blur(10px);padding:10px 12px;border-bottom:1px solid var(--line)}
.top-card{background:linear-gradient(135deg,#f36532,#ff7c3e);border-radius:14px;padding:13px 14px;box-shadow:0 8px 24px rgba(0,0,0,.24);display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px}.top-times{min-width:0;overflow:hidden}.top-direct{font-size:clamp(34px,10.4vw,50px);font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}.countdown{display:flex;align-items:baseline;gap:3px;white-space:nowrap}.countdown-num{font-size:clamp(24px,7vw,34px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}.countdown-label{font-size:12px;font-weight:800;opacity:.9;white-space:nowrap}.clock{font-size:clamp(13px,4vw,18px);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}.status-row{display:flex;gap:12px;margin-top:7px;color:var(--muted);font-size:11px}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px}.status-dot.on{background:var(--out)}
.tabs{padding:8px;background:var(--surface);border-bottom:1px solid var(--line)}.primary-routes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.extra-routes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}.extra-routes[hidden]{display:none}.tab{min-height:48px;border:2px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--muted);font-size:15px;font-weight:800;padding:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0}.primary-tab{width:100%}.tab.active-out{color:#fff;background:#1f6f36;border-color:var(--out)}.tab.active-home{color:#fff;background:#086e9b;border-color:var(--home)}.home-ico{width:44px;height:44px;flex:0 0 44px;color:currentColor;display:block}.route-toggle{width:100%;height:30px;margin:5px 0 0;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.route-toggle-arrow{font-size:22px;line-height:1;transition:transform .16s ease}.route-toggle[aria-expanded="true"] .route-toggle-arrow{transform:rotate(180deg)}
.notice{display:none;margin:10px 12px 0;padding:9px 12px;border:1px solid #6f5d2a;border-radius:8px;background:#342c18;color:#ffe69a;font-size:12px}.section{display:none;padding:12px}.section.visible{display:block}
.journey{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:12px}.journey-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.journey-title strong{font-size:15px}.journey-total{color:var(--muted);font-size:12px}.timeline{display:grid;grid-template-columns:74px 1fr;column-gap:10px}.station-time{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;text-align:right;padding:8px 0}.station-box{background:var(--surface2);border-radius:9px;padding:8px 11px;margin:2px 0}.station-name{font-size:16px;font-weight:900}.station-note{font-size:11px;color:var(--muted);margin-top:2px}.line-time{color:var(--muted);font-size:11px;text-align:right;padding:8px 0}.line-box{padding:7px 10px;color:var(--muted);font-size:12px;border-left:2px solid var(--line);margin-left:10px}.transfer-time{color:var(--purple);font-size:18px;font-weight:900;text-align:right;padding:9px 0}.transfer-box{padding:8px 10px;background:rgba(213,161,237,.12);border:1px solid rgba(213,161,237,.4);border-radius:8px;color:var(--purple);font-weight:800;margin:3px 0}.transfer-box.warn{color:var(--yellow);border-color:rgba(255,211,90,.45);background:rgba(255,211,90,.1)}.detail-actions{display:flex;gap:8px;margin-top:11px}.detail-link{flex:1;text-align:center;text-decoration:none;color:#fff;background:#246f9b;border:1px solid var(--home);border-radius:8px;padding:9px 7px;font-size:12px;font-weight:800}.detail-link.jr{background:#85571d;border-color:var(--yellow)}.detail-link.disabled{pointer-events:none;opacity:.35}
.hours-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 8px;align-items:start}.hour{display:flex;align-items:stretch;min-width:0;margin:0}.hour-label{width:25px;flex:0 0 25px;text-align:right;padding:9px 4px 0 0;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}.hour-line{width:1px;flex:0 0 1px;background:var(--line);margin:0 5px}.minutes{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;padding:4px 0;min-width:0;flex:1}.chip{position:relative;min-width:38px;min-height:34px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);text-decoration:none;display:flex;align-items:center;justify-content:center;padding:4px 5px;cursor:pointer;font-weight:800;font-variant-numeric:tabular-nums}.chip .minute{font-size:22.5px;line-height:1}.chip.transfer-chip{min-width:42px}.chip.past{opacity:.28}.chip.next{background:var(--orange);border-color:var(--orange);color:#fff}.chip.selected{outline:2px solid var(--purple);outline-offset:1px}.chip.special:after{content:"通過";position:absolute;right:-4px;top:-5px;background:var(--yellow);color:#28200c;border-radius:4px;padding:1px 3px;font-size:8px;font-weight:900}.chip.special{opacity:.5}.legend{display:flex;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding:12px;color:var(--muted);font-size:11px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:10px;height:10px;border-radius:3px;background:var(--surface);border:1px solid var(--line)}.dot.next{background:var(--orange);border-color:var(--orange)}.dot.transfer{background:var(--purple);border:0}.dot.pass{background:var(--yellow);border:0}

/* Pixel 10a portrait target: 1080x2424 physical -> about 412 CSS px at default Android scale */
@media (min-width:410px) and (max-width:414px) and (orientation:portrait){
 body{width:100%;max-width:100%;overflow-x:hidden;padding-bottom:20px}
 header{padding:9px}
 .top-card{padding:10px;border-radius:14px;grid-template-columns:1fr auto;grid-template-areas:"times times" "count clock";gap:6px 10px}
 .top-times{grid-area:times;overflow:visible;text-align:center}
 .top-direct{font-size:42px;line-height:1;letter-spacing:-.4px}
 .countdown{grid-area:count;justify-self:start}
 .countdown-num{font-size:29px}
 .countdown-label{font-size:12px}
 .clock{grid-area:clock;justify-self:end;font-size:17px}
 .status-row{margin-top:6px;font-size:11px}
 .tabs{padding:8px 9px}
 .primary-routes{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
 .primary-tab{min-height:78px;padding:1px;font-size:31px;line-height:1;gap:3px;white-space:nowrap;overflow:hidden}
 .primary-tab .home-ico{width:68px;height:68px;flex-basis:68px}
 .route-toggle{height:31px;margin-top:3px}
 .route-toggle-arrow{font-size:24px}
 .extra-routes{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:3px}
 .extra-routes .tab{width:100%;min-width:0;min-height:62px;padding:1px;font-size:22px;line-height:1;gap:2px;white-space:nowrap;overflow:hidden}
 .extra-routes .home-ico{width:54px;height:54px;flex-basis:54px}
 .section{padding:9px}
 .hours-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 8px}
 .hour-label{width:26px;flex-basis:26px;padding-right:3px}
 .hour-line{margin:0 5px}
 .minutes{gap:4px}
 .chip{min-width:40px;min-height:40px;padding:4px}
 .chip.transfer-chip{min-width:40px}
 .timeline{grid-template-columns:70px minmax(0,1fr);column-gap:9px}
 .journey{padding:10px}
 .detail-actions{gap:7px}
}
@media(min-width:700px){body{max-width:820px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}.tab{font-size:18px}.section{padding:16px}.hours-grid{gap:7px 14px}.hour-label{width:30px;flex-basis:30px}.hour-line{margin:0 7px}.chip{min-width:44px}.chip.transfer-chip{min-width:44px}}

.jp-imgtext{display:inline-flex;align-items:center;vertical-align:-.08em;line-height:1;white-space:inherit;max-width:100%}
.jp-img-run{display:inline-block;height:1em;width:var(--jp-w);background:currentColor;
 -webkit-mask:var(--jp-mask) center/100% 100% no-repeat;mask:var(--jp-mask) center/100% 100% no-repeat;
 flex:0 0 auto}


.meiryo-route-label{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 height:1em;
 line-height:1;
 vertical-align:-.06em;
 flex:0 0 auto;
}
.meiryo-route-label > span{
 display:block;
 height:1em;
 width:var(--route-meiryo-w);
 background:currentColor;
 -webkit-mask:var(--route-meiryo-mask) center/100% 100% no-repeat;
 mask:var(--route-meiryo-mask) center/100% 100% no-repeat;
}


/* Real Orbitron PNG digit glyphs */
.png-digits{
 display:inline-flex;
 align-items:baseline;
 justify-content:inherit;
 gap:.035em;
 white-space:nowrap;
 line-height:1;
}
.png-digit{
 display:inline-block;
 height:.86em;
 width:auto;
 object-fit:contain;
 vertical-align:-.04em;
}
.png-digit-colon{
 height:.70em;
 margin:0 -.02em;
 vertical-align:.02em;
}
.top-direct .png-digit{height:.90em}
.countdown-num .png-digit{height:.90em}
.clock .png-digit{height:.88em}
.hour-label .png-digit{height:.82em}
.minute .png-digit{height:.88em}
.station-time .png-digit{height:.88em}
.transfer-time .png-digit{height:.86em}
.line-time .png-digit,.journey-total .png-digit,.transfer-box .png-digit{height:.82em}

 }

 }

</svg></button>

function digitsHtml(value){
 const s=String(value);
 return `<span class="png-digits" aria-label="${s.replace(/"/g,'&quot;')}">`+
  [...s].map(ch=>{
   if(DIGIT_PNG[ch]){
    const c=ch===':'?' png-digit-colon':'';
    return `<img class="png-digit${c}" src="${DIGIT_PNG[ch]}" alt="${ch}" draggable="false">`;
   }
   return `<span>${ch}</span>`;
  }).join('')+

function updatePastVisibility(r,n){

  currentIndex=hours.findIndex(hour=>Number(hour.dataset.hour)>currentHour);

 }
 if(currentIndex<=0)return;

 const rowStart=Math.floor(currentIndex/2)*2;

<script>
(()=>{
 const JP=/[\u3040-\u30ff\u3400-\u9fff\uf900-\ufaff々〆ヶー]+/g;
 const SKIP=new Set(['SCRIPT','STYLE','SVG','PATH','META','LINK','TITLE','CANVAS']);
 const cache=new Map();
 const test=document.createElement('canvas').getContext('2d');

 function makeMask(text){
  if(cache.has(text)) return cache.get(text);
  const family='"Meiryo W53 Bold", Meiryo, sans-serif';
  let px=100;
  test.font=`700 ${px}px ${family}`;
  let m=test.measureText(text);
  const h0=(m.actualBoundingBoxAscent||80)+(m.actualBoundingBoxDescent||18);
  px*=88/Math.max(1,h0);

  test.font=`700 ${px}px ${family}`;
  m=test.measureText(text);
  const asc=m.actualBoundingBoxAscent||px*.8;
  const desc=m.actualBoundingBoxDescent||px*.18;
  const left=Math.max(0,m.actualBoundingBoxLeft||0);
  const right=Math.max(m.width,m.actualBoundingBoxRight||m.width);
  const H=128,pad=8,W=Math.max(12,Math.ceil(left+right+pad*2));

  const c=document.createElement('canvas');
  c.width=W;c.height=H;
  const x=c.getContext('2d');
  x.font=`700 ${px}px ${family}`;
  x.textBaseline='alphabetic';
  x.fillStyle='#fff';
  x.fillText(text,pad+left,(H-(asc+desc))/2+asc);

  const out={mask:c.toDataURL('image/png'),ratio:W/H};
  cache.set(text,out);
  return out;
 }

 function convert(node){
  if(!node.parentElement || SKIP.has(node.parentElement.tagName) || node.parentElement.closest('.jp-imgtext')) return;
  const text=node.nodeValue;
  if(!text || !JP.test(text)){JP.lastIndex=0;return}
  JP.lastIndex=0;

  const frag=document.createDocumentFragment();
  let last=0,match;
  while((match=JP.exec(text))){
   if(match.index>last) frag.appendChild(document.createTextNode(text.slice(last,match.index)));
   const data=makeMask(match[0]);
   const wrap=document.createElement('span');
   wrap.className='jp-imgtext';
   wrap.setAttribute('role','img');
   wrap.setAttribute('aria-label',match[0]);

   const run=document.createElement('span');
   run.className='jp-img-run';
   run.style.setProperty('--jp-mask',`url("${data.mask}")`);
   run.style.setProperty('--jp-w',`${data.ratio.toFixed(4)}em`);
   run.setAttribute('aria-hidden','true');

   wrap.appendChild(run);
   frag.appendChild(wrap);
   last=JP.lastIndex;
  }
  if(last<text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  node.replaceWith(frag);
 }

 function scan(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{
   acceptNode(n){
    if(!n.parentElement || SKIP.has(n.parentElement.tagName) || n.parentElement.closest('.jp-imgtext')) return NodeFilter.FILTER_REJECT;
    JP.lastIndex=0;
    return JP.test(n.nodeValue||'')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
   }
  });
  const nodes=[];
  while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(convert);
 }

 function start(){
  scan(document.body);
  new MutationObserver(ms=>{
   for(const m of ms) for(const n of m.addedNodes){
    if(n.nodeType===Node.TEXT_NODE) convert(n);
    else if(n.nodeType===Node.ELEMENT_NODE && !n.closest('.jp-imgtext')) scan(n);
   }
  }).observe(document.body,{childList:true,subtree:true});
 }

 const ready=document.fonts
   ? document.fonts.load('700 100px "Meiryo W53 Bold"')
   : Promise.resolve();

 Promise.race([ready,new Promise(r=>setTimeout(r,1800))]).then(start);
})();
</script>


<script>
(()=>{
 const targets=[...document.querySelectorAll('.meiryo-route-label[data-meiryo]')];
 if(!targets.length) return;

 const family='"Meiryo W53 Bold", Meiryo, sans-serif';
 const cache=new Map();
 const measure=document.createElement('canvas').getContext('2d');

 function make(text){
  if(cache.has(text)) return cache.get(text);

  let px=120;
  measure.font=`700 ${px}px ${family}`;
  let m=measure.measureText(text);
  let h=(m.actualBoundingBoxAscent||96)+(m.actualBoundingBoxDescent||24);
  px*=96/Math.max(1,h);

  measure.font=`700 ${px}px ${family}`;
  m=measure.measureText(text);

  const asc=m.actualBoundingBoxAscent||px*.8;
  const desc=m.actualBoundingBoxDescent||px*.18;
  const left=Math.max(0,m.actualBoundingBoxLeft||0);
  const right=Math.max(m.width,m.actualBoundingBoxRight||m.width);
  const H=128,pad=8,W=Math.ceil(left+right+pad*2);

  const c=document.createElement('canvas');
  c.width=W;c.height=H;
  const x=c.getContext('2d');
  x.font=`700 ${px}px ${family}`;
  x.textBaseline='alphabetic';
  x.fillStyle='#fff';
  x.fillText(text,pad+left,(H-(asc+desc))/2+asc);

  const out={mask:c.toDataURL('image/png'),ratio:W/H};
  cache.set(text,out);
  return out;
 }

 function paint(){
  for(const el of targets){
   const text=el.dataset.meiryo||'';
   const d=make(text);
   const run=document.createElement('span');
   run.setAttribute('aria-hidden','true');
   run.style.setProperty('--route-meiryo-mask',`url("${d.mask}")`);
   run.style.setProperty('--route-meiryo-w',`${d.ratio.toFixed(4)}em`);
   el.replaceChildren(run);
   el.setAttribute('role','img');
   el.setAttribute('aria-label',text);
  }
 }

 const ready=document.fonts
   ? document.fonts.load('700 120px "Meiryo W53 Bold"')
   : Promise.resolve();

 Promise.race([ready,new Promise(r=>setTimeout(r,1800))]).then(paint);
})();
</script>
