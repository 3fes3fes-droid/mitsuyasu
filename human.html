<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>誕生日DB</title>
<link rel="stylesheet" href="human.css">
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand">誕生日DB</div>
    <div class="stats" id="headerStats">読込中</div>
    <div class="spacer"></div>
    <div class="toolbar">
      <button class="icon-btn" id="filterBtn" title="絞り込み" aria-label="絞り込み" onclick="toggleFilters()">
        <svg viewBox="0 0 24 24"><path d="M4 5h16M7 12h10M10 19h4"/></svg>
      </button>
      <button class="icon-btn" title="一括検索" aria-label="一括検索" onclick="toggleBulk()">
        <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      </button>
      <button class="icon-btn" title="新規追加" aria-label="新規追加" onclick="openNewEntry()">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" title="その他" aria-label="その他" onclick="toggleMenu()">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
      </button>
      <button class="text-btn primary" id="syncBtn" onclick="syncGitHub()" title="GitHubと同期">
        <svg viewBox="0 0 24 24"><path d="M20 7h-9M16 3l4 4-4 4M4 17h9M8 21l-4-4 4-4"/></svg><span id="syncLabel">同期</span>
      </button>
    </div>
  </div>
</header>

<div class="search-shell">
  <div class="search-area">
    <div class="search-row">
      <div class="searchbox">
        <span class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span>
        <input id="omniInput" autocomplete="off" placeholder="名前・本名で検索" aria-label="人物検索">
        <button class="clear-search hidden" id="clearBtn" onclick="clearOmni()" aria-label="検索を消す">×</button>
      </div>
      <button class="icon-btn" id="remoteSearchBtn" title="Wikidataでも検索" aria-label="Wikidataでも検索" onclick="runOmniSearch()">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M11 8v6M8 11h6"/></svg>
      </button>
    </div>
    <div class="filters" id="filters">
      <input id="f-year" type="number" placeholder="年 1985" min="1" max="2100" oninput="filterChanged()">
      <select id="f-month" onchange="filterChanged()"><option value="">月</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select>
      <input id="f-day" type="number" placeholder="日 15" min="1" max="31" oninput="filterChanged()">
      <input id="f-job" placeholder="職業" oninput="filterChanged()">
      <input id="f-country" placeholder="国" oninput="filterChanged()">
    </div>
    <div class="subtools">
      <div class="status" id="status"></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="sortBtn" title="並び順" aria-label="並び順" onclick="toggleSort()">
        <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h8M8 18h4M4 6h.01M4 12h.01M4 18h.01"/></svg>
      </button>
    </div>
    <div class="bulk-panel" id="bulkPanel">
      <textarea id="bulkTextarea" placeholder="1行に1人"></textarea>
      <div class="bulk-row">
        <button class="text-btn primary" id="bulkStartBtn" onclick="startBulk()">一括検索</button>
        <button class="text-btn" onclick="clearBulk()">消去</button>
        <span class="meta" id="bulkMeta"></span>
      </div>
      <div class="bulk-log" id="bulkLog"></div>
      <div class="bulk-grid" id="bulkGrid"></div>
      <div class="bulk-row hidden" id="bulkSaveRow">
        <button class="text-btn primary" onclick="bulkSaveChecked()">チェック分を保存</button>
        <button class="text-btn" onclick="bulkToggleAll(true)">全選択</button>
        <button class="text-btn" onclick="bulkToggleAll(false)">全解除</button>
      </div>
    </div>
    <div class="menu-panel" id="menuPanel">
      <div class="bulk-row">
        <button class="text-btn" onclick="fetchAllBirthplaces()">出身地を補完</button>
        <button class="text-btn" onclick="exportJSON()">JSON保存</button>
        <label class="text-btn" style="cursor:pointer">JSON読込<input type="file" accept=".json" class="hidden" onchange="importJSON(event)"></label>
        <button class="text-btn" onclick="openSyncSettings()">GitHub設定</button>
        <button class="text-btn" onclick="discardPending()">未同期を破棄</button>
      </div>
    </div>
  </div>
</div>

<main>
  <section class="section remote" id="remoteSection">
    <div class="section-head"><h2>Wikidata候補</h2><span class="count" id="remoteCount">0</span><div class="section-actions"><button class="icon-btn" title="閉じる" onclick="hideRemote()">×</button></div></div>
    <div id="remoteResults"></div>
  </section>
  <section class="section">
    <div class="section-head"><h2>保存済み</h2><span class="count" id="localCount">0</span></div>
    <div id="localResults"></div>
    <button class="text-btn more hidden" id="moreBtn" onclick="showMore()">さらに表示</button>
  </section>
</main>

<div class="modal-bg" id="editModal" onclick="if(event.target===this)closeEdit()">
  <div class="modal">
    <div class="modal-head"><h3 id="editTitle">人物を編集</h3><div class="spacer"></div><button class="icon-btn" onclick="closeEdit()">×</button></div>
    <input type="hidden" id="editId">
    <div class="formgrid">
      <div class="field full"><label>表示名</label><div class="field-row"><input id="editName"><button class="text-btn" id="autofillBtn" type="button" onclick="autofillFromWikidata()" title="Wikidataから候補を自動入力">Wikidata</button></div></div>
      <div class="field"><label>本名</label><input id="editRealName"></div>
      <div class="field"><label>生年月日</label><input id="editBirthday" placeholder="1972-11-13"></div>
      <div class="field"><label>職業</label><input id="editOccupation"></div>
      <div class="field"><label>国</label><input id="editCountry"></div>
      <div class="field"><label>出身地</label><input id="editBirthplace"></div>
      <div class="field full"><label>別名</label><input id="editNameEn"></div>
      <div class="field full"><label>メモ</label><textarea id="editMemo"></textarea></div>
    </div>
    <div class="modal-foot"><button class="text-btn" onclick="closeEdit()">閉じる</button><button class="text-btn primary" onclick="saveEdit()">保存</button></div>
  </div>
</div>

<div class="modal-bg" id="syncModal" onclick="if(event.target===this)closeSyncSettings()">
  <div class="modal" style="max-width:560px">
    <div class="modal-head"><h3>GitHub同期</h3><div class="spacer"></div><button class="icon-btn" onclick="closeSyncSettings()">×</button></div>
    <div class="field"><label>Fine-grained personal access token</label><input id="tokenInput" type="password" autocomplete="off" placeholder="github_pat_..."></div>
    <div class="sync-note">リポジトリ <b>3fes3fes-droid/mitsuyasu</b> の Contents: Read and write が必要です。トークンはこのタブの sessionStorage にだけ保存し、HTMLやJSONには書き込みません。</div>
    <div class="modal-foot"><button class="text-btn" onclick="forgetToken()">トークン削除</button><button class="text-btn primary" onclick="saveToken()">このタブで使用</button></div>
  </div>
</div>

<div class="notice" id="notice"></div>

<script src="human.js"></script>
</body>
</html>
