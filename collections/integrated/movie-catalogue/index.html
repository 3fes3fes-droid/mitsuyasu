<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2f3f4"><title>映画棚 | 光康サイト</title><meta name="description" content="観た映画、予告編、出演者と監督でつながる映画棚"><link rel="stylesheet" href="movies.css"></head><body data-size="large">
<main class="wrap"><header><div class="header-actions"><div class="search-control"><button id="searchToggle" type="button" aria-label="検索" aria-expanded="false" aria-controls="search movieFilters"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg></button><input type="search" id="search" aria-label="タイトル・出演者・監督を検索" placeholder="タイトル・出演者" hidden></div></div></header>
<section id="movieFilters" class="toolbar" aria-label="映画を探す" hidden><div class="controls"><select id="scope" aria-label="表示する作品"><option value="all">すべて</option><option value="watched">観た</option><option value="unwatched">未鑑賞</option><option value="personal">Filmarksの自分のリスト</option></select><select id="sort" aria-label="並び順"><option value="random">ランダム</option><option value="total_count">人気：計</option><option value="clip_count">人気：予</option><option value="mark_count">人気：視</option><option value="year">公開年</option><option value="title">作品名</option></select><button id="peopleView">出演者・監督</button><button id="shuffle" title="並びをシャッフル">🎲 ランダム</button></div><details id="genreBox"><summary>ジャンルで絞り込む <span id="genreCount"></span></summary><div class="genre-tools"><select id="genreMode" aria-label="ジャンル条件"><option value="include">選んだジャンルを表示</option><option value="exclude">選んだジャンルを除外</option></select><button id="genreClear">解除</button></div><div id="genres"></div></details></section>
<div class="resultbar"><h2 id="heading">すべての映画</h2><span id="count" aria-live="polite"></span></div><section id="grid" class="grid" aria-label="映画一覧"></section><button id="more" hidden>続きを表示</button><footer id="coverage" hidden></footer></main>
<dialog id="detail" aria-label="出演者・作品詳細"><div class="dialog-tools"><button id="dialogBack" hidden>戻る</button><button id="close" aria-label="閉じる">×</button></div><div id="detailBody"></div></dialog><dialog id="trailer" aria-label="動画再生"><div class="dialog-tools"><button id="trailerClose" aria-label="閉じる">×</button></div><div id="trailerBody"></div></dialog><script src="movies.js"></script></body></html>
