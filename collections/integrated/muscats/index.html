<html lang="ja">

<title>恵比寿マスカッツ</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b0b0d;color:#f6f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
main{width:min(1500px,100%);margin:0 auto;padding:12px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.card{min-width:0;background:#151519;border-radius:12px;overflow:hidden}
.photo-link{display:block;aspect-ratio:4/5;background:#222;overflow:hidden;text-decoration:none}
.photo{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 24%;background:#25252b;transition:transform .18s ease}
.photo-link:hover .photo{transform:scale(1.025)}
.info{padding:8px 6px 10px;display:flex;align-items:center;justify-content:center;gap:6px}
.name{min-width:0;color:#f6f6f8;text-align:center;text-decoration:none;font-size:15px;font-weight:800;line-height:1.35;overflow-wrap:anywhere}
.name:hover{text-decoration:underline}
.copy-btn{flex:0 0 auto;border:0;border-radius:6px;padding:4px 7px;background:#2b2b31;color:#f6f6f8;font-size:11px;font-weight:700;cursor:pointer}
.copy-btn:hover{background:#3a3a42}
.copy-btn.copied{background:#4a4a54}
@media(max-width:800px){main{padding:8px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{border-radius:9px}.name{font-size:13px}}
@media(max-width:430px){main{padding:6px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.info{padding:7px 4px 9px;gap:4px}.name{font-size:13px}.copy-btn{font-size:10px;padding:3px 5px}}
</style>
</head>

function bingImage(query, host='tse1.mm.bing.net'){
  return `https://${host}/th?q=${encodeURIComponent(query)}&w=480&h=600&c=7&rs=1&p=0`;
}
function placeholder(name){
  const safe = String(name).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  const text = safe.replace(/（.*?）/g,'').slice(0,7);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600"><rect width="100%" height="100%" fill="#25252b"/><circle cx="240" cy="220" r="92" fill="#3b3b45"/><path d="M95 540c18-115 86-174 145-174s127 59 145 174" fill="#3b3b45"/><text x="240" y="575" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#d7d7dd">${text}</text></svg>`;
  return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
}
function imageError(img){
  if(img.dataset.strict==='1'){
    img.onerror=null;
    img.src=placeholder('');
    return;
  }
  const step = +(img.dataset.step || 0);
  const q = img.dataset.query;
  if(step===0){img.dataset.step='1';img.src=bingImage(q,'tse1.mm.bing.net');return;}
  if(step===1){img.dataset.step='2';img.src=bingImage(q,'tse2.mm.bing.net');return;}
  img.onerror=null;
  img.src=placeholder(img.alt);
}
window.imageError=imageError;

async function copyName(btn){
  const name = btn.dataset.name || '';
  try{
    await navigator.clipboard.writeText(name);
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=name;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
  }
  const old=btn.textContent;
  btn.textContent='済';btn.classList.add('copied');
  setTimeout(()=>{btn.textContent=old;btn.classList.remove('copied');},700);
}
window.copyName=copyName;

function cardHTML(m){
  const strict = m.strictImage === true;
  const direct = m.image || (strict ? placeholder('') : bingImage(m.fallbackQuery));
  const step = m.image ? 0 : 1;
  const yt = `https://www.youtube.com/results?search_query=${encodeURIComponent(m.searchName)}`;
  const google = `https://www.google.com/search?q=${encodeURIComponent(m.searchName)}`;
  return `<article class="card">
    <a class="photo-link" href="${yt}" target="_blank" rel="noopener noreferrer" aria-label="${m.name}をYouTubeで検索">
      <img class="photo" src="${direct}" data-query="${m.fallbackQuery}" data-step="${step}" data-strict="${strict?'1':'0'}" onerror="imageError(this)" alt="${m.name}" loading="lazy" decoding="async" referrerpolicy="no-referrer">
    </a>
    <div class="info"><a class="name" href="${google}" target="_blank" rel="noopener noreferrer">${m.name}</a><button class="copy-btn" type="button" data-name="${m.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" onclick="copyName(this)">コピー</button></div>
  </article>`;
}

document.getElementById('grid').innerHTML = members.map(cardHTML).join('');
