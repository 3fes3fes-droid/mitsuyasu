<style>
*{box-sizing:border-box}
:root{--bg:#090b0f;--panel:#11151b;--panel2:#191e27;--line:#2b323d;--text:#f2f4f7;--muted:#8e99a8;--accent:#f0c34a;--link:#8ec5ff;--win:#79d8a4;--draw:#7dc2fa}
html{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Meiryo,sans-serif}
body{margin:0} .wrap{max-width:1700px;margin:auto;padding:12px 14px 60px}
header{display:flex;justify-content:space-between;align-items:end;gap:15px;padding:8px 2px 12px;border-bottom:1px solid var(--line)}
h1{font-size:24px;margin:0;letter-spacing:-.02em}
.stats{display:flex;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:10px;text-align:right}
.stats b{display:block;color:var(--accent);font-size:18px}
.controls{position:sticky;top:0;z-index:30;background:rgba(9,11,15,.96);backdrop-filter:blur(10px);padding:8px 0;display:grid;grid-template-columns:2.4fr .7fr .85fr .7fr;gap:7px}
input,select,button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:9px 10px;font:inherit;min-width:0}
button{cursor:pointer;font-weight:800}
.status{font-size:11px;color:var(--muted);padding:1px 2px 7px}
.tablebox{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:1320px}
th{position:sticky;top:55px;z-index:20;background:#181d25;color:#96a0ae;text-align:left;font-size:11px;padding:9px;border-bottom:1px solid var(--line)}
td{padding:9px;border-bottom:1px solid #222833;vertical-align:top;font-size:12px}
tr.data:hover td{background:#151a22}
.year td{background:#202630!important;color:var(--accent);font-size:18px;font-weight:950;border-top:2px solid #39414d;padding:8px 10px}
.date{white-space:nowrap;color:#b8c1cc}
.match{min-width:255px;font-weight:900;font-size:13px}
.vs{font-size:10px;color:#66717f;margin:0 6px}
.personlink{color:var(--link);text-decoration:none;border-bottom:1px dotted #5e84aa}
.personlink:hover{color:#d4e9ff;border-bottom-style:solid}
.food{min-width:350px} .foodline+.foodline{margin-top:6px}
.who{font-size:10px;color:#8994a3;margin-right:4px} .hate{font-weight:850;color:#f7d772}
.reason{font-size:10px;color:#a0a9b5;margin-top:1px} .menu{font-size:10px;color:#788594;margin-top:2px;line-height:1.45}
.result{font-weight:900;white-space:nowrap} .win{color:var(--win)} .draw{color:var(--draw)} .none{color:#515b68}
.ep{min-width:350px;max-width:540px;color:#c8ced6;line-height:1.55}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle}
@media(max-width:760px){
.wrap{padding:8px 7px 40px} header{display:block} h1{font-size:20px} .stats{margin-top:8px;text-align:left}
.controls{grid-template-columns:1fr 1fr} .controls input{grid-column:1/-1}
.tablebox{border:0;overflow:visible;background:none} table{display:block;min-width:0} thead{display:none} tbody{display:grid;gap:6px}
tr.data{display:block;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px} td{display:block;border:0;padding:2px 0}
.year{display:block;background:none;border:0} .year td{background:none!important;border:0;font-size:20px;padding:12px 1px 3px}
.match{font-size:15px;margin-bottom:5px} .food,.ep{min-width:0;max-width:none} .result{margin:5px 0}
}
</style>

const N=s=>String(s??"").normalize("NFKC").toLowerCase();
const q=document.getElementById("q"),year=document.getElementById("year"),filter=document.getElementById("filter"),body=document.getElementById("body");
[...new Set(DATA.map(r=>r.date.slice(0,4)))].sort((a,b)=>b-a).forEach(y=>year.insertAdjacentHTML("beforeend",`<option value="${y}">${y}年</option>`));
let newest=false;

function googleLink(name,opponent,date){
  const term=`"${name}" "${opponent}" 食わず嫌い王決定戦 ${date.replaceAll("-","/")} 嫌いな食べ物 勝敗`;
  const href="https://www.google.com/search?q="+encodeURIComponent(term);
  return `<a class="personlink" href="${href}" target="_blank" rel="noopener" title="この対戦の詳細をGoogle検索">${E(name)}</a>`;
}
function filtered(){
 const x=N(q.value.trim());
 return DATA.filter(r=>{
   const blob=N([r.date,r.a,r.b,r.da,r.db,r.result,r.episode,r.menuA,r.menuB,r.reasonA,r.reasonB].join(" "));
   if(x&&!blob.includes(x))return false;
   if(year.value&&!r.date.startsWith(year.value))return false;
   if(filter.value==="both"&&!(r.da&&r.db))return false;
   if(filter.value==="food"&&!(r.da||r.db))return false;
   if(filter.value==="result"&&!r.result)return false;
   if(filter.value==="episode"&&!r.episode)return false;
   if(filter.value==="rich"&&!(r.menuA||r.menuB||r.reasonA||r.reasonB))return false;
   return true;
 }).sort((a,b)=>newest?b.date.localeCompare(a.date):a.date.localeCompare(b.date));
}
function foodBlock(name,opponent,hate,reason,menu,date){
 return `<div class="foodline"><span class="who">${googleLink(name,opponent,date)}：</span>${hate?`<span class="hate">${E(hate)}</span>`:`<span class="none">—</span>`}${reason?`<div class="reason">嫌いな理由：${E(reason)}</div>`:""}${menu?`<div class="menu">候補：${E(menu)}</div>`:""}</div>`;
}
function render(){
 const list=filtered(); let last="";
 body.innerHTML=list.map(r=>{
   let yy=r.date.slice(0,4), head="";
   if(yy!==last){head=`<tr class="year"><td colspan="5">${yy}</td></tr>`;last=yy}
   const rich=(r.menuA||r.menuB||r.reasonA||r.reasonB)?'<span class="dot"></span>':"";
   const rs=!r.result?'<span class="none">—</span>':r.result==="引き分け"?'<span class="result draw">引き分け</span>':`<span class="result win">勝：${E(r.result)}</span>`;
   return head+`<tr class="data">
     <td class="date">${E(r.date.replaceAll("-","."))}${rich}</td>
     <td class="match">${googleLink(r.a,r.b,r.date)}<span class="vs">VS</span>${googleLink(r.b,r.a,r.date)}</td>
     <td class="food">${foodBlock(r.a,r.b,r.da,r.reasonA,r.menuA,r.date)}${foodBlock(r.b,r.a,r.db,r.reasonB,r.menuB,r.date)}</td>
     <td>${rs}</td>
     <td class="ep">${r.episode?E(r.episode):'<span class="none">—</span>'}</td>
   </tr>`;
 }).join("");
 document.getElementById("status").textContent=`表示 ${list.length} / ${DATA.length}　対戦者名クリック → Google検索`;
}
q.oninput=render; year.onchange=render; filter.onchange=render;
document.getElementById("order").onclick=e=>{newest=!newest;e.currentTarget.textContent=newest?"古い順":"新しい順";render()};
render();
</script>
</body></html>
