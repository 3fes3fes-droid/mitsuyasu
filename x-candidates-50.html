<script>
(()=>{'use strict';
const DATA=JSON.parse(document.getElementById('payload').textContent);
const rows=DATA.candidates||[];
const categories=['すべて',...new Set(rows.map(x=>x.category))];
const KEY='mitsuyasu_x_candidate_50_v1';
const state={category:'すべて',search:'',selectedOnly:false,order:'curated',photosOnly:false};
const q=id=>document.getElementById(id);
let chosen=new Set();
try{chosen=new Set((JSON.parse(localStorage.getItem(KEY)||'[]')||[]).map(x=>String(x).toLowerCase()))}catch{}
const safeUrl=(u,orig=false)=>{
  try{const url=new URL(u);if(url.protocol!=='https:')return '';
    if(orig)return ['x.com','twitter.com'].includes(url.hostname)?url.href:'';
    return ['pbs.twimg.com','video.twimg.com'].includes(url.hostname)?url.href:'';
  }catch{return ''}
};
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
const anchor=(url,cls,label)=>{const a=el('a',cls,label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a};
const trunc=(s,n=165)=>String(s||'').length>n?String(s).slice(0,n)+'…':String(s||'');
const shortDate=(s)=>s?String(s).slice(5):'日時不明';
const image=(url,cls)=>{const img=el('img',cls);img.src=url;img.loading='lazy';img.decoding='async';img.alt='投稿画像';img.referrerPolicy='no-referrer';img.onerror=()=>{img.style.objectFit='contain';img.alt='画像の取得に失敗';img.style.opacity='.3'};return img};
const fragText=(parent,txt)=>{
 const re=/https?:\/\/[^\s<>]+/g;let pos=0;const text=String(txt||'');
 for(const match of text.matchAll(re)){
  const start=match.index;if(start>pos)parent.append(document.createTextNode(text.slice(pos,start)));
  const found=match[0].replace(/[.,)）】]+$/,'');let href='';
  try{const u=new URL(found);if(['https:'].includes(u.protocol))href=u.href}catch{}
  parent.append(href?anchor(href,'inline-url',found):document.createTextNode(found));
  pos=start+match[0].length;
 }
 if(pos<text.length)parent.append(document.createTextNode(text.slice(pos)));
};
function stats(){q('selectCount').textContent='選択：'+chosen.size+' / '+rows.length;q('headCount').textContent=rows.length}
function save(){try{localStorage.setItem(KEY,JSON.stringify([...chosen]))}catch{}stats()}
function toast(text){const t=q('toast');t.textContent=text;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{t.hidden=true},2400)}
function addPost(post){
 const box=el('article','post');
 const bar=el('div','post-meta');
 bar.append(el('span','post-date',shortDate(post.date)));
 bar.append(anchor(safeUrl(post.url,true)||'https://x.com/','origin-link','元投稿 ↗'));
 box.append(bar);
 const list=Array.isArray(post.media)?post.media.slice(0,2):[];
 if(list.length){
  const media=el('div','media');media.style.setProperty('--media-cols',list.length);
  list.forEach(m=>{
   const slot=el('div','media-item');const src=safeUrl(m.src);const postUrl=safeUrl(post.url,true)||'https://x.com/';
   if(m.kind==='video'){
    if(src){const visual=image(src,'poster');slot.append(visual);}
    else{slot.append(el('div','media-empty','動画'));}
    if(safeUrl(m.video)){
     const play=el('button','video-trigger');play.type='button';play.setAttribute('aria-label','この動画を再生');play.append(el('span','play','▶'));
     play.addEventListener('click',()=>{slot.replaceChildren();const v=el('video');v.controls=true;v.playsInline=true;v.preload='metadata';if(src)v.poster=src;v.src=safeUrl(m.video);slot.append(v);v.play().catch(()=>{})});
     slot.append(play);
    }else slot.append(anchor(postUrl,'video-trigger','元投稿で再生'));
    slot.append(el('span','video-label','VIDEO'));
   }else if(src){const a=anchor(postUrl,'imglink','');a.append(image(src,''));slot.append(a)}
   else slot.append(el('div','media-empty','画像'));
   media.append(slot);
  });box.append(media);
 }else box.append(el('div','media-empty','テキスト投稿'));
 const text=el('div','post-text');fragText(text,trunc(post.text,255));box.append(text);
 return box
}
function addAccount(a,index){
 const section=el('section','account');section.id='u-'+a.handle.toLowerCase();
 const meta=el('div','account-meta');
 meta.append(el('div','ordinal',String(index+1).padStart(2,'0')+' / '+String(rows.length).padStart(2,'0')+'　'+a.category));
 const identity=el('div','identity');
 const src=safeUrl(a.avatar);
 if(src){const av=image(src,'avatar');av.alt=a.name;identity.append(av)}
 else identity.append(el('div','avatar'));
 const idtext=el('div','identity-name');idtext.append(el('div','account-name',a.name));idtext.append(el('div','handle','@'+a.handle));
 identity.append(idtext);meta.append(identity);
 if(a.bio)meta.append(el('p','bio',trunc(a.bio,195)));
 const metric=el('div','metrics');
 metric.append(el('span','',a.posts_checked+'投稿確認'));
 metric.append(el('span','',a.posts_with_media+'件に画像・動画'));
 meta.append(metric);
 if(a.latest_text){const latest=el('div','latest');latest.append(el('small','', '直近の投稿 / '+shortDate(a.latest_date)));latest.append(el('p','',trunc(a.latest_text,150)));meta.append(latest)}
 const action=el('div','account-actions');
 const label=el('label','choice'+(chosen.has(a.handle.toLowerCase())?' selected':''));
 const checkbox=el('input');checkbox.type='checkbox';checkbox.checked=chosen.has(a.handle.toLowerCase());
 label.append(checkbox,document.createTextNode('採用候補'));
 checkbox.addEventListener('change',()=>{
  const key=a.handle.toLowerCase();
  if(checkbox.checked)chosen.add(key);else chosen.delete(key);
  label.classList.toggle('selected',checkbox.checked);save();
  if(state.selectedOnly)render();
 });
 action.append(label,anchor('https://x.com/'+encodeURIComponent(a.handle),'openprofile','アカウントを開く ↗'));
 meta.append(action);
 const posts=el('div','posts');
 (a.preview||[]).slice(0,2).forEach(post=>posts.append(addPost(post)));
 section.append(meta,posts);return section
}
function allVisible(){
 let out=rows.map((a,i)=>({...a,_i:i}));
 if(state.category!=='すべて')out=out.filter(a=>a.category===state.category);
 if(state.selectedOnly)out=out.filter(a=>chosen.has(a.handle.toLowerCase()));
 if(state.photosOnly)out=out.filter(a=>a.preview?.some(p=>p.media?.length));
 if(state.search){const needle=state.search.toLocaleLowerCase();out=out.filter(a=>[a.name,a.handle,a.category,a.bio,a.latest_text,...(a.preview||[]).map(p=>p.text)].join(' ').toLocaleLowerCase().includes(needle))}
 if(state.order==='latest')out.sort((a,b)=>(b.latest_date||'').localeCompare(a.latest_date||''));
 return out
}
function render(){
 const results=allVisible(),node=q('accounts');node.replaceChildren();
 const frag=document.createDocumentFragment();
 results.forEach(a=>frag.append(addAccount(a,a._i)));
 node.append(frag);
 if(!results.length)node.append(el('div','empty','この条件に当てはまる候補はありません'));
 q('resultCount').textContent='表示中 '+results.length+' / '+rows.length+' アカウント　｜　実投稿 '+results.reduce((n,x)=>n+(x.preview||[]).length,0)+' 件';
 stats()
}
function filters(){
 const node=q('filters');node.replaceChildren();
 categories.forEach(cat=>{
  const n=rows.filter(x=>cat==='すべて'||x.category===cat).length;
  const b=el('button','filter'+(state.category===cat?' active':''));b.type='button';b.append(el('span','',cat),el('em','',String(n)));
  b.addEventListener('click',()=>{state.category=cat;filters();render()});
  node.append(b);
 })
}
q('generatedAt').textContent='取得 '+String(DATA.snapshot||'').slice(0,16).replace('T',' ');
q('search').addEventListener('input',e=>{state.search=e.target.value.trim();render()});
q('selectedOnly').addEventListener('change',e=>{state.selectedOnly=e.target.checked;render()});
q('orderCurated').addEventListener('click',()=>{state.order='curated';q('orderCurated').classList.add('active');q('orderLatest').classList.remove('active');render()});
q('orderLatest').addEventListener('click',()=>{state.order='latest';q('orderLatest').classList.add('active');q('orderCurated').classList.remove('active');render()});
q('photoOnly').addEventListener('click',()=>{state.photosOnly=!state.photosOnly;q('photoOnly').classList.toggle('active',state.photosOnly);render()});
q('copySelected').addEventListener('click',async()=>{
 const ids=rows.filter(a=>chosen.has(a.handle.toLowerCase())).map(a=>'@'+a.handle).join('\n');
 if(!ids){toast('まず採用候補にチェックを付けてください');return}
 try{await navigator.clipboard.writeText(ids);toast(chosen.size+'件のIDをコピーしました')}
 catch{const ta=el('textarea');ta.value=ids;document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'IDをコピーしました':'コピーできませんでした')}
});
filters();render()
})();
</script>
</body>
</html>
