name: anabatsu channel thumbnail build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/anabatsu-thumbnails.yml"
      - "py/youtube_channel_thumbnails.py"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Deno for YouTube JS challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install latest yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]"

      - name: Build complete embedded-thumbnail HTML
        run: |
          python py/youtube_channel_thumbnails.py \
            "https://www.youtube.com/@anabatsu" \
            -o anabatsu_all_thumbnails.html \
            --workers 16

      - name: Verify final HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("anabatsu_all_thumbnails.html")
          assert p.exists(), p
          assert p.stat().st_size > 1000, p.stat().st_size
          assert b'data:image/' in p.read_bytes()
          print(p, p.stat().st_size)
          PY

      - name: Upload final HTML
        uses: actions/upload-artifact@v4
        with:
          name: anabatsu-all-thumbnails
          path: anabatsu_all_thumbnails.html
          if-no-files-found: error
          retention-days: 7
