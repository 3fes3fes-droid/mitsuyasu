name: Rasterize izuni Meiryo v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meiryo-rasterize-v2.yml'

permissions:
  contents: write

jobs:
  rasterize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rasterize actual Meiryo
        shell: pwsh
        run: ./.github/scripts/meiryo_rasterize.ps1
      - name: Commit and push
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add izuni.html
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Use actual Meiryo raster glyphs in izuni'
          git push
