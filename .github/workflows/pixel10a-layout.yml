name: Pixel 10a izuni layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pixel10a-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Pixel 10a layout only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('izuni.html')
          s=p.read_text(encoding='utf-8')
          marker='/* Pixel 10a portrait layout: 6.3in, 1080x2424, 20:9 */'
          if marker not in s:
              css='''\n/* Pixel 10a portrait layout: 6.3in, 1080x2424, 20:9 */\n@media (max-width:430px){\n html,body{width:100%;max-width:100%;overflow-x:hidden}\n body{padding-bottom:calc(20px + env(safe-area-inset-bottom))}\n header{padding:8px max(8px,env(safe-area-inset-right)) 7px max(8px,env(safe-area-inset-left))}\n .top-card{padding:10px 10px 9px;gap:6px 10px}\n .tabs{padding:7px 6px 6px}\n .tab-row{gap:5px;margin-bottom:5px}\n .tab{width:100%;height:68px;padding:2px;grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr)}\n .tab-arrow{width:18px}\n .section{padding:8px 6px 12px}\n .hours-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 7px}\n .hour-label{width:27px;flex-basis:27px;padding-right:3px}\n .hour-line{margin:0 4px}\n .minutes{gap:4px}\n .chip{min-width:42px;min-height:44px;padding:3px 4px}\n .journey{padding:10px}\n .timeline{grid-template-columns:72px minmax(0,1fr)}\n .detail-actions{gap:6px}\n}\n'''
              s=s.replace('@media(min-width:700px){',css+'\n@media(min-width:700px){',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit izuni only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add izuni.html
          git diff --cached --quiet && exit 0
          git commit -m 'Optimize izuni for Pixel 10a viewport'
          git push
