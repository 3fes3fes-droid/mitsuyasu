name: Kana channel thumbnail build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kana-thumbnails.yml"
      - "kana_thumbnail_builder/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Deno for YouTube JS challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install latest yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]"

      - name: Build complete embedded-thumbnail HTML
        run: python kana_thumbnail_builder/build.py

      - name: Upload result and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kana-all-thumbnails
          path: kana_thumbnail_builder/output/*
          if-no-files-found: error
          retention-days: 7
