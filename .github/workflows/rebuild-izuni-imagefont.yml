name: Rebuild izuni image-font UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-izuni-imagefont.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild izuni UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('izuni.html')
          s=p.read_text(encoding='utf-8')

          if 'fonts.googleapis.com/css2?family=Orbitron' not in s:
              s=s.replace('<title>伊豆仁田 時刻表</title>', '<title>伊豆仁田 時刻表</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&display=swap" rel="stylesheet">',1)

          s=s.replace('<div class="status-row"><span><i id="gps-dot" class="status-dot"></i><span id="gps-text">GPS取得中</span></span><span>平日ダイヤ</span></div>', '<div class="status-row"><span><i id="gps-dot" class="status-dot"></i><span id="gps-text">GPS取得中</span></span></div>')
          s=s.replace('<div id="weekend" class="notice">このHTMLは平日ダイヤ専用です。</div>\n','')
          s=s.replace('<div class="legend"><span><i class="dot next"></i>次の電車</span><span><i class="dot transfer"></i>選択中</span><span><i class="dot pass"></i>伊豆仁田通過</span><span><i class="dot"></i>押すと詳細</span></div>\n','')
          s=s.replace("if([0,6].includes(new Date().getDay()))document.getElementById('weekend').style.display='block';\n",'')

          marker='/* ===== Bright image-glyph UI ===== */'
          if marker not in s:
              css=r'''
/* ===== Bright image-glyph UI ===== */
:root{--bg:#07162f;--surface:#102a4c;--surface2:#16385f;--line:#3a78a8;--text:#ffffff;--muted:#a9d7f4;--out:#3af0a7;--home:#4ed8ff;--orange:#ff7c47;--purple:#e07dff;--yellow:#ffe45f;--danger:#ff7d91}
html{background:#061127}
body{min-height:100vh;background:radial-gradient(circle at 12% 8%,rgba(70,219,255,.28),transparent 34%),radial-gradient(circle at 88% 22%,rgba(224,125,255,.19),transparent 30%),radial-gradient(circle at 50% 100%,rgba(58,240,167,.13),transparent 38%),linear-gradient(180deg,#0a1c3c 0%,#08182f 46%,#061127 100%);color:var(--text);padding-bottom:18px}
header{background:rgba(7,22,47,.86);border-bottom:1px solid rgba(78,216,255,.35);box-shadow:0 8px 28px rgba(0,0,0,.18)}
.top-card{background:linear-gradient(135deg,#ff6d48 0%,#ff9d55 58%,#ffc25e 100%);border:1px solid rgba(255,255,255,.38);box-shadow:0 10px 30px rgba(255,124,71,.22),inset 0 1px 0 rgba(255,255,255,.25)}
.top-direct{font-size:clamp(30px,9vw,46px);letter-spacing:.015em;text-shadow:0 2px 8px rgba(72,28,10,.24)}
.countdown-num{font-size:clamp(28px,8vw,40px);text-shadow:0 2px 8px rgba(72,28,10,.2)}.countdown-label{font-size:13px}.clock{font-size:clamp(14px,4.4vw,20px)}
.status-row{margin-top:7px;color:#c8eaff;font-size:12px}.status-dot{background:#7594ad}.status-dot.on{background:#46f0a8;box-shadow:0 0 10px rgba(70,240,168,.8)}
.tabs{background:rgba(10,28,60,.72);border-bottom:1px solid rgba(78,216,255,.24);padding:9px}
.tab{min-height:52px;border:1px solid rgba(118,190,236,.45);background:linear-gradient(180deg,rgba(25,61,103,.94),rgba(18,44,80,.94));color:#c5e9ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.tab.active-out{background:linear-gradient(135deg,#0f9f73,#22c98d);border-color:#55ffc0;color:#fff;box-shadow:0 0 18px rgba(58,240,167,.23)}.tab.active-home{background:linear-gradient(135deg,#087eb8,#22bde9);border-color:#6be4ff;color:#fff;box-shadow:0 0 18px rgba(78,216,255,.23)}
.section{padding:12px}.journey{background:linear-gradient(180deg,rgba(17,45,80,.97),rgba(13,35,65,.97));border:1px solid rgba(87,184,238,.43);box-shadow:0 12px 26px rgba(0,0,0,.16)}
.station-box{background:linear-gradient(180deg,#1b4674,#153a63);border:1px solid rgba(98,195,247,.18)}.line-box{border-left-color:#347cac;color:#b3def7}.line-time{color:#9ecdeb}.transfer-box{background:rgba(224,125,255,.15);border-color:rgba(231,144,255,.55)}
.hours-grid{gap:7px 9px}.hour-label{color:#9dd8fb;font-size:15px;padding-top:10px}.hour-line{background:linear-gradient(180deg,rgba(78,216,255,.7),rgba(78,216,255,.08))}.minutes{gap:6px;padding:4px 0 7px}
.chip{min-width:42px;min-height:39px;border:1px solid rgba(105,196,246,.38);border-radius:9px;background:linear-gradient(180deg,rgba(27,68,113,.98),rgba(18,49,88,.98));color:#f4fbff;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 10px rgba(0,0,0,.12)}
.chip .minute{font-size:23px;line-height:1}.chip:hover{border-color:#6de1ff}.chip.past{opacity:.26}.chip.next{background:linear-gradient(135deg,#ff684c,#ff914d);border-color:#ffc16c;color:#fff;box-shadow:0 0 18px rgba(255,123,71,.38)}.chip.selected{outline:2px solid #e88cff;outline-offset:2px}
.chip.special:after{content:"";right:-2px;top:-2px;width:9px;height:9px;padding:0;border-radius:50%;background:#ffe45f;box-shadow:0 0 9px rgba(255,228,95,.9)}
.detail-link{background:linear-gradient(135deg,#1284bd,#26bfe6);border-color:#68e5ff}.detail-link.jr{background:linear-gradient(135deg,#d4871d,#ffb43c);border-color:#ffe45f}.home-ico{filter:drop-shadow(0 0 6px rgba(255,255,255,.12))}
.imgtext{display:inline-flex;align-items:baseline;white-space:inherit;gap:0;vertical-align:baseline}.glyph-img{display:inline-block;height:1em;width:var(--gw,.62em);background:currentColor;-webkit-mask:var(--glyph) center/contain no-repeat;mask:var(--glyph) center/contain no-repeat;vertical-align:-.08em;flex:0 0 auto}.glyph-space{display:inline-block;width:.34em;height:1em;flex:0 0 auto}.glyph-digit,.glyph-punct{vertical-align:-.06em}
@media(min-width:700px){.chip{min-width:48px;min-height:42px}.chip .minute{font-size:25px}.top-direct{font-size:48px}}
'''
              s=s.replace('</style>',css+'\n</style>',1)

          if 'const DIGIT_RE=/[0-9:]/;' not in s:
              js=r'''
<script>
(()=>{
 const cache=new Map(),DIGIT_RE=/[0-9:]/,SKIP=new Set(['SCRIPT','STYLE','SVG','PATH','META','LINK','TITLE']);let active=false;
 function makeGlyph(ch){const digit=DIGIT_RE.test(ch),key=(digit?'o:':'m:')+ch;if(cache.has(key))return cache.get(key);const c=document.createElement('canvas'),ctx=c.getContext('2d'),pad=16,font=digit?'800 88px Orbitron, Noto Sans Mono, monospace':'800 82px Meiryo, "Yu Gothic", "Hiragino Sans", "Noto Sans CJK JP", sans-serif';ctx.font=font;ctx.textBaseline='alphabetic';const m=ctx.measureText(ch),asc=Math.ceil(m.actualBoundingBoxAscent||82),desc=Math.ceil(m.actualBoundingBoxDescent||18),w=Math.max(22,Math.ceil(m.width)+pad*2),h=Math.max(112,asc+desc+pad*2);c.width=w;c.height=h;ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.font=font;ctx.textBaseline='alphabetic';ctx.fillText(ch,pad,pad+asc);const out={data:c.toDataURL('image/png'),ratio:Math.max(.18,Math.min(1.5,(m.width||40)/82)),digit};cache.set(key,out);return out}
 function glyphSpan(ch){if(ch===' '||ch==='\u3000'){const s=document.createElement('span');s.className='glyph-space';s.setAttribute('aria-hidden','true');return s}const g=makeGlyph(ch),s=document.createElement('span');s.className='glyph-img'+(g.digit?' glyph-digit':'')+(/[.,:;!?／/ー―→←（）()\-]/.test(ch)?' glyph-punct':'');s.style.setProperty('--glyph',`url("${g.data}")`);s.style.setProperty('--gw',`${g.ratio.toFixed(3)}em`);s.setAttribute('aria-hidden','true');return s}
 function convertTextNode(node){if(!node.parentElement||SKIP.has(node.parentElement.tagName)||node.parentElement.closest('.imgtext'))return;const txt=node.nodeValue;if(!txt||!txt.trim())return;const wrap=document.createElement('span');wrap.className='imgtext';wrap.setAttribute('role','img');wrap.setAttribute('aria-label',txt.trim());for(const ch of txt)wrap.appendChild(glyphSpan(ch));node.replaceWith(wrap)}
 function scan(root){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!n.parentElement||SKIP.has(n.parentElement.tagName)||n.parentElement.closest('.imgtext'))return NodeFilter.FILTER_REJECT;return n.nodeValue&&n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}}),arr=[];while(walker.nextNode())arr.push(walker.currentNode);arr.forEach(convertTextNode)}
 function start(){if(active)return;active=true;scan(document.body);const obs=new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===Node.TEXT_NODE)convertTextNode(n);else if(n.nodeType===Node.ELEMENT_NODE&&!n.closest('.imgtext'))scan(n)}});obs.observe(document.body,{childList:true,subtree:true})}
 const fontReady=(document.fonts&&document.fonts.load)?document.fonts.load('800 88px Orbitron'):Promise.resolve();Promise.race([fontReady,new Promise(r=>setTimeout(r,1800))]).then(start)
})();
</script>
'''
              s=s.replace('</body>',js+'\n</body>',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit rebuilt UI
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add izuni.html
          git diff --cached --quiet && exit 0
          git commit -m 'Rebuild izuni with image glyph UI'
          git push
