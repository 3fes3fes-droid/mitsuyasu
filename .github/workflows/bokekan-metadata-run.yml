name: Bokekan metadata preservation

on:
  push:
    branches: [main]
    paths: [".github/workflows/bokekan-metadata-run.yml"]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install
        run: python -m pip install -q requests remotezip

      - name: Extract all boke.csv files by HTTP Range
        run: |
          cat > /tmp/extract.py <<'PY'
          import os, csv, json, gzip, html
          from pathlib import Path
          import requests
          from remotezip import RemoteZip

          cans = [
            'blue_000','yellow_000','yellow_001','yellow_002','yellow_003','yellow_004',
            'yellow_005','yellow_006','yellow_007','yellow_008','yellow_009',
            'green_000','red_000','sp_000'
          ]
          bases = [
            'https://bokekan-ap-northeast-1.s3.ap-northeast-1.amazonaws.com/21-6-1/',
            'https://bokekan-ap-northeast-1.s3-ap-northeast-1.amazonaws.com/21-6-1/',
            'https://s3.ap-northeast-1.amazonaws.com/bokekan-ap-northeast-1/21-6-1/',
          ]
          out = Path('bokekan_metadata')
          out.mkdir()
          chosen = None
          log = []
          for base in bases:
            u = base + 'sp_000.zip'
            try:
              r = requests.get(u, headers={'Range':'bytes=0-0','User-Agent':'Mozilla/5.0'}, timeout=20, allow_redirects=True)
              log.append({'url':u,'status':r.status_code,'content_range':r.headers.get('Content-Range'),'length':r.headers.get('Content-Length')})
              if r.status_code in (200,206):
                chosen = base
                break
            except Exception as e:
              log.append({'url':u,'error':repr(e)})
          (out/'probe.json').write_text(json.dumps(log, ensure_ascii=False, indent=2), encoding='utf-8')
          if not chosen:
            raise SystemExit('No public bokekan S3 endpoint responded')

          manifest=[]
          total=0
          for can in cans:
            url = chosen + can + '.zip'
            print('OPEN', url, flush=True)
            try:
              rz = RemoteZip(url, headers={'User-Agent':'Mozilla/5.0'})
              names = rz.namelist()
              csvname = next((n for n in names if n.lower().endswith('/boke.csv') or n.lower()=='boke.csv'), None)
              if not csvname:
                raise RuntimeError('boke.csv not found: '+repr(names[:20]))
              data = rz.read(csvname)
              raw = out/(can+'.csv')
              raw.write_bytes(data)
              rows = max(0, data.count(b'\n')-1)
              total += rows
              with gzip.open(out/(can+'.csv.gz'),'wb',compresslevel=6) as g:
                g.write(data)
              raw.unlink()
              manifest.append({'can':can,'rows_approx':rows,'csv_gz':can+'.csv.gz','source':url,'zip_member':csvname})
              print(can, rows, len(data), flush=True)
            except Exception as e:
              manifest.append({'can':can,'error':repr(e),'source':url})
              print('ERR', can, repr(e), flush=True)

          (out/'manifest.json').write_text(json.dumps({'base':chosen,'total_rows_approx':total,'cans':manifest}, ensure_ascii=False, indent=2), encoding='utf-8')

          cards=[]
          for x in manifest:
            if 'error' in x:
              cards.append(f"<li><b>{html.escape(x['can'])}</b> ERROR {html.escape(x['error'])}</li>")
            else:
              cards.append(f"<li><a href='{x['csv_gz']}'><b>{html.escape(x['can'])}</b></a> — {x['rows_approx']:,} records</li>")
          page = f"""<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
          <title>bokete ボケ缶 metadata backup</title>
          <style>body{{font-family:system-ui,sans-serif;max-width:900px;margin:32px auto;padding:0 16px;line-height:1.6}}li{{margin:.45em 0}}</style>
          <h1>bokete ボケ缶 metadata backup</h1>
          <p>Approx total records: <b>{total:,}</b></p>
          <p>各 gzip は元データセット内 boke.csv。ID / odai_id / users / text / category / posted_at / rate_sum / rate_count / labels 等を含む。</p>
          <ul>{''.join(cards)}</ul>"""
          (out/'index.html').write_text(page, encoding='utf-8')
          PY
          python /tmp/extract.py

      - name: Upload metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bokete-bokekan-metadata-1100542
          path: bokekan_metadata/
          retention-days: 90
          compression-level: 0
          if-no-files-found: warn
