name: Bokete backup retry pass

on:
  push:
    branches: [main]
    paths: [".github/workflows/bokete-retry-run.yml"]

permissions:
  actions: read
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      GH_TOKEN: \${{ github.token }}
      OUT_DIR: bokete_backup
      SEED_FILE: retry_urls.txt
      MAX_PAGES: "250000"
      MAX_ASSETS: "500000"
      MAX_SECONDS: "1800"
      WORKERS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Restore pass 1
        run: |
          mkdir -p prev
          gh run download 36706126361 -R "$GITHUB_REPOSITORY" -n bokete-backup-2026-09-30 -D prev
          cat prev/bokete_backup.tar.zst.part-* > /tmp/pass1.tar.zst
          tar --zstd -xf /tmp/pass1.tar.zst
          cp bokete_backup/manifest.csv bokete_backup/manifest_pass1.csv
          cp bokete_backup/errors.csv bokete_backup/errors_pass1.csv
          cp bokete_backup/stats.json bokete_backup/stats_pass1.json
          python - <<'PY'
          import csv
          from urllib.parse import urlsplit
          good=[]
          with open('bokete_backup/errors_pass1.csv',encoding='utf-8-sig') as f:
              for r in csv.DictReader(f):
                  u=r.get('url',''); e=r.get('error','')
                  h=(urlsplit(u).hostname or '').lower()
                  if h in {'bokete.jp','www.bokete.jp','select.bokete.jp'} and ('HTTP 5' in e or 'timeout' in e.lower() or 'connection' in e.lower()):
                      good.append(u)
          seen=set()
          with open('retry_urls.txt','w',encoding='utf-8') as f:
              for u in good:
                  if u not in seen:
                      seen.add(u); f.write(u+'\n')
          print('retry seeds',len(seen))
          PY

      - name: Fetch retry crawler
        run: |
          curl -fsSL "https://raw.githubusercontent.com/3fes3fes-droid/mitsuyasu/bokete-backup-20260930/tools/bokete_backup.py" -o /tmp/bokete_backup.py
          python -m pip install --disable-pip-version-check -q requests beautifulsoup4 brotli

      - name: Retry failed Bokete URLs
        continue-on-error: true
        run: python /tmp/bokete_backup.py 2>&1 | tee bokete_backup/logs/crawler_pass2.log

      - name: Merge manifests and rebuild index
        if: always()
        run: |
          cp bokete_backup/manifest.csv bokete_backup/manifest_pass2.csv || true
          cp bokete_backup/errors.csv bokete_backup/errors_pass2.csv || true
          cp bokete_backup/stats.json bokete_backup/stats_pass2.json || true
          python - <<'PY'
          import csv, html
          from pathlib import Path
          root=Path('bokete_backup')
          rows=[]
          for fn in ['manifest_pass1.csv','manifest_pass2.csv']:
              p=root/fn
              if not p.exists(): continue
              with p.open(encoding='utf-8-sig') as f:
                  rows.extend(csv.DictReader(f))
          ded={}
          for r in rows:
              k=r.get('final_url') or r.get('url')
              if k: ded[k]=r
          fields=['url','final_url','status','content_type','bytes','path','title']
          with (root/'manifest.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader()
              for r in ded.values(): w.writerow({k:r.get(k,'') for k in fields})
          items=[]
          for r in ded.values():
              if 'text/html' not in (r.get('content_type') or ''): continue
              p=r.get('path','').replace(chr(92),'/')
              t=html.escape(r.get('title') or r.get('final_url') or r.get('url') or '')
              u=html.escape(r.get('final_url') or r.get('url') or '')
              items.append(f'<li><a href="{p}">{t}</a><small>{u}</small></li>')
          page='''<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
          <title>bokete backup</title><style>body{font-family:system-ui,sans-serif;margin:20px;background:#111;color:#eee}
          input{width:100%;box-sizing:border-box;padding:14px;font-size:18px;position:sticky;top:0}
          li{margin:8px 0}a{color:#8cc8ff;text-decoration:none}small{display:block;color:#999;word-break:break-all}</style>
          <h1>bokete backup</h1><p id=s></p><input id=q placeholder="タイトル・URL検索"><ul id=l>'''+''.join(items)+'''</ul>
          <script>const a=[...document.querySelectorAll('li')],q=document.querySelector('#q'),s=document.querySelector('#s');
          s.textContent=a.length+' HTML pages';q.oninput=()=>{let x=q.value.toLowerCase();for(const e of a)e.hidden=x&&!e.innerText.toLowerCase().includes(x)}</script>'''
          (root/'index.html').write_text(page,encoding='utf-8')
          print('merged urls',len(ded),'html',len(items))
          PY

      - name: Package merged backup
        if: always()
        run: |
          {
            echo "created_utc=$(date -u +%FT%TZ)"
            echo "files=$(find bokete_backup -type f | wc -l)"
            echo "bytes=$(du -sb bokete_backup | cut -f1)"
            echo "html=$(find bokete_backup/site -type f \( -name '*.html' -o -name '*.htm' \) | wc -l)"
            echo "images=$(find bokete_backup/site -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.gif' -o -name '*.webp' \) | wc -l)"
          } | tee bokete_backup/INVENTORY.txt
          tar -I 'zstd -3 -T0' -cf /tmp/bokete_backup_pass2.tar.zst bokete_backup
          split -b 1900m -d -a 3 /tmp/bokete_backup_pass2.tar.zst bokete_backup_pass2.tar.zst.part-

      - name: Upload merged backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bokete-backup-pass2-2026-09-30
          path: |
            bokete_backup_pass2.tar.zst.part-*
            bokete_backup/INVENTORY.txt
            bokete_backup/manifest.csv
            bokete_backup/errors_pass1.csv
            bokete_backup/errors_pass2.csv
            bokete_backup/stats_pass1.json
            bokete_backup/stats_pass2.json
          retention-days: 90
          compression-level: 0
          if-no-files-found: warn
