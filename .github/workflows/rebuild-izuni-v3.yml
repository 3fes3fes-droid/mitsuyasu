name: Rebuild izuni UI v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-izuni-v3.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild UI from pre-image-font version
        shell: bash
        run: |
          BASE=$(git log --format=%H -- izuni.html | sed -n '2p')
          test -n "$BASE"
          git show "$BASE:izuni.html" > izuni.html
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('izuni.html')
          s=p.read_text(encoding='utf-8')

          # Fonts used only as sources for browser-side image masks.
          s=s.replace(
              '<title>伊豆仁田 時刻表</title>',
              '<title>伊豆仁田 時刻表</title>\n'
              '<link rel="preconnect" href="https://fonts.googleapis.com">\n'
              '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
              '<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">',
              1
          )

          css=r'''<style>
:root{
 --bg:#f4f8fb;--surface:#ffffff;--surface2:#edf5fa;--line:#c6d7e3;--text:#18344b;--muted:#698093;
 --out:#25ad78;--home:#348fc8;--orange:#ff7a3d;--purple:#9564bd;--yellow:#f4c94d;--danger:#e65e70;
}
*{box-sizing:border-box}
html{background:#eef5f9}
body{
 margin:0;min-height:100vh;color:var(--text);
 font-family:"BIZ UDPGothic",Meiryo,"Yu Gothic",sans-serif;font-size:14px;padding-bottom:20px;
 background:
  radial-gradient(circle at 8% 0%,rgba(255,193,130,.34),transparent 28%),
  radial-gradient(circle at 100% 18%,rgba(121,201,240,.28),transparent 32%),
  linear-gradient(180deg,#fffaf3 0%,#f5fbff 42%,#eef6fa 100%);
}
button,a{font:inherit}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(9px);padding:10px 12px;border-bottom:1px solid #d7e4ec;box-shadow:0 4px 16px rgba(43,83,111,.08)}
.top-card{
 border-radius:16px;padding:12px 14px 11px;color:#fff;
 background:linear-gradient(135deg,#ff7450 0%,#ff9558 55%,#ffb362 100%);
 box-shadow:0 7px 20px rgba(225,108,61,.2);
 display:grid;grid-template-columns:1fr auto;grid-template-areas:"times times" "count clock";align-items:end;gap:8px 14px;
}
.top-times{grid-area:times;min-width:0;text-align:center;overflow:hidden}.top-direct{font-size:clamp(30px,8.5vw,43px);font-weight:900;line-height:1.04;white-space:nowrap;font-variant-numeric:tabular-nums}
.countdown{grid-area:count;display:flex;align-items:baseline;gap:3px;justify-self:start;white-space:nowrap}.countdown-num{font-size:clamp(28px,7.5vw,38px);font-weight:900;line-height:1}.countdown-label{font-size:13px;font-weight:900}.clock{grid-area:clock;font-size:clamp(16px,4.6vw,21px);font-weight:900;white-space:nowrap;text-align:right;justify-self:end}
.status-row{display:flex;gap:10px;margin-top:7px;color:#5f788c;font-size:12px;font-weight:700}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9caeba;margin-right:6px}.status-dot.on{background:#2bb87e}
.tabs{padding:10px 9px 9px;background:rgba(255,255,255,.8);border-bottom:1px solid #d7e4ec}
.tab-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:7px}.tab-row:last-child{margin-bottom:0}
.tab{
 min-width:0;height:72px;border:2px solid #c8d9e5;border-radius:13px;background:#fff;color:#4d6b80;
 font-size:clamp(18px,4.8vw,22px);font-weight:900;padding:3px 4px;cursor:pointer;
 display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);align-items:center;justify-items:center;gap:1px;
 box-shadow:0 3px 10px rgba(44,84,111,.08);
}
.tab-side{width:100%;min-width:0;display:flex;align-items:center;justify-content:center;line-height:1}.tab-arrow{display:flex;align-items:center;justify-content:center;width:22px;font-size:1.05em;line-height:1}
.tab.active-out{color:#fff;background:#32b783;border-color:#209f6e;box-shadow:0 4px 12px rgba(37,173,120,.2)}
.tab.active-home{color:#fff;background:#409ed4;border-color:#2c88bd;box-shadow:0 4px 12px rgba(52,143,200,.2)}
.home-ico{width:36px;height:36px;flex:0 0 36px;color:currentColor;display:block}
.section{display:none;padding:12px}.section.visible{display:block}
.journey{background:#fff;border:1px solid #cfdee7;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 5px 15px rgba(48,82,104,.08)}
.journey-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.journey-title strong{font-size:16px}.journey-total{color:#657f92;font-size:12px}.timeline{display:grid;grid-template-columns:78px 1fr;column-gap:10px}.station-time{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;text-align:right;padding:8px 0}.station-box{background:#edf6fb;border:1px solid #d5e5ef;border-radius:10px;padding:8px 11px;margin:2px 0}.station-name{font-size:16px;font-weight:900}.station-note{font-size:11px;color:#6d8496;margin-top:2px}.line-time{color:#6f899a;font-size:12px;text-align:right;padding:8px 0}.line-box{padding:7px 10px;color:#6f899a;font-size:12px;border-left:2px solid #bad2e1;margin-left:10px}.transfer-time{color:#8d58b5;font-size:19px;font-weight:900;text-align:right;padding:9px 0}.transfer-box{padding:8px 10px;background:#f5ebfb;border:1px solid #d8b9eb;border-radius:8px;color:#8755ad;font-weight:900;margin:3px 0}.transfer-box.warn{color:#8b6811;border-color:#ead286;background:#fff7d9}
.detail-actions{display:flex;gap:8px;margin-top:11px}.detail-link{flex:1;text-align:center;text-decoration:none;color:#fff;background:#409ed4;border:1px solid #2c88bd;border-radius:9px;padding:10px 7px;font-size:13px;font-weight:900}.detail-link.jr{background:#e59b35;border-color:#ce8424}.detail-link.disabled{pointer-events:none;opacity:.35}
.hours-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 9px;align-items:start}.hour{display:flex;align-items:stretch;min-width:0;margin:0}.hour-label{width:30px;flex:0 0 30px;text-align:right;padding:10px 4px 0 0;color:#507086;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}.hour-line{width:2px;flex:0 0 2px;background:#b9d3e1;margin:0 6px;border-radius:2px}.minutes{display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px;padding:4px 0 7px;min-width:0;flex:1}
.chip{position:relative;min-width:44px;min-height:42px;border:1px solid #c4d8e4;border-radius:9px;background:#fff;color:#24465d;text-decoration:none;display:flex;align-items:center;justify-content:center;padding:3px 5px;cursor:pointer;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 2px 7px rgba(43,79,104,.06)}
.chip .minute{font-size:22px;line-height:1}.chip.transfer-chip{min-width:44px}.chip.past{opacity:.28}.chip.next{background:#ff8050;border-color:#ee6737;color:#fff;box-shadow:0 3px 10px rgba(238,103,55,.22)}.chip.selected{outline:3px solid #b07ad1;outline-offset:1px}.chip.special:after{content:"";position:absolute;right:3px;top:3px;width:7px;height:7px;background:#f4c94d;border-radius:50%}.chip.special{opacity:.55}
.imgtext{display:inline-flex;align-items:center;vertical-align:-.08em;white-space:inherit;line-height:1;max-width:100%}.img-run{display:inline-block;height:1em;width:var(--iw);background:currentColor;-webkit-mask:var(--mask) center/100% 100% no-repeat;mask:var(--mask) center/100% 100% no-repeat;flex:0 0 auto}.img-space{display:inline-block;width:.28em;height:1em;flex:0 0 auto}
@media(min-width:700px){
 body{max-width:820px;margin:auto;border-left:1px solid #d9e5ec;border-right:1px solid #d9e5ec}.section{padding:16px}.tabs{padding:12px}.tab-row{gap:10px}.tab{height:82px;font-size:27px;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr)}.tab-arrow{width:28px}.home-ico{width:42px;height:42px;flex-basis:42px}.hours-grid{gap:10px 16px}.chip{min-width:49px;min-height:45px}.chip .minute{font-size:24px}.hour-label{width:34px;flex-basis:34px;font-size:20px}.hour-line{margin:0 7px}.top-direct{font-size:46px}}
</style>'''
          s=re.sub(r'<style>.*?</style>',css,s,count=1,flags=re.S)

          tabs=r'''<div class="tabs">
 <div class="tab-row">
  <button class="tab active-out" data-route="out-daito"><span class="tab-side"><svg class="home-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12.5 12 4l9 8.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11v9h14v-9" fill="currentColor" opacity=".18"/><path d="M5 11v9h14v-9" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M10 20v-5h4v5" fill="currentColor"/></svg></span><span class="tab-arrow">→</span><span class="tab-side">大仁</span></button>
  <button class="tab" data-route="out-mishima"><span class="tab-side"><svg class="home-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12.5 12 4l9 8.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11v9h14v-9" fill="currentColor" opacity=".18"/><path d="M5 11v9h14v-9" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M10 20v-5h4v5" fill="currentColor"/></svg></span><span class="tab-arrow">→</span><span class="tab-side">三島</span></button>
  <button class="tab" data-route="out-numazu"><span class="tab-side"><svg class="home-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12.5 12 4l9 8.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11v9h14v-9" fill="currentColor" opacity=".18"/><path d="M5 11v9h14v-9" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M10 20v-5h4v5" fill="currentColor"/></svg></span><span class="tab-arrow">→</span><span class="tab-side">沼津</span></button>
 </div>
 <div class="tab-row">
  <button class="tab" data-route="home-daito"><span class="tab-side">大仁</span><span class="tab-arrow">→</span><span class="tab-side"><svg class="home-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12.5 12 4l9 8.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11v9h14v-9" fill="currentColor" opacity=".18"/><path d="M5 11v9h14v-9" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M10 20v-5h4v5" fill="currentColor"/></svg></span></button>
  <button class="tab" data-route="home-mishima"><span class="tab-side">三島</span><span class="tab-arrow">→</span><span class="tab-side"><svg class="home-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12.5 12 4l9 8.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11v9h14v-9" fill="currentColor" opacity=".18"/><path d="M5 11v9h14v-9" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M10 20v-5h4v5" fill="currentColor"/></svg></span></button>
  <button class="tab" data-route="home-numazu"><span class="tab-side">沼津</span><span class="tab-arrow">→</span><span class="tab-side"><svg class="home-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12.5 12 4l9 8.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11v9h14v-9" fill="currentColor" opacity=".18"/><path d="M5 11v9h14v-9" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M10 20v-5h4v5" fill="currentColor"/></svg></span></button>
 </div>
</div>'''
          s=re.sub(r'<div class="tabs">.*?</div>\s*<div id="weekend"',tabs+'\n<div id="weekend"',s,count=1,flags=re.S)

          s=s.replace('<div class="status-row"><span><i id="gps-dot" class="status-dot"></i><span id="gps-text">GPS取得中</span></span><span>平日ダイヤ</span></div>','<div class="status-row"><span><i id="gps-dot" class="status-dot"></i><span id="gps-text">GPS取得中</span></span></div>')
          s=re.sub(r'\n?<div id="weekend" class="notice">.*?</div>','',s,count=1)
          s=re.sub(r'\n?<div class="legend">.*?</div>','',s,count=1,flags=re.S)
          s=s.replace("if([0,6].includes(new Date().getDay()))document.getElementById('weekend').style.display='block';\n",'')

          image_text=r'''
<script>
(()=>{
 const SKIP=new Set(['SCRIPT','STYLE','SVG','PATH','META','LINK','TITLE','CANVAS']);
 const cache=new Map();
 let active=false;
 const TEST=document.createElement('canvas').getContext('2d');

 function splitRuns(text){
  const out=[];let cur='',kind='';
  for(const ch of text){
   const k=/[0-9:]/.test(ch)?'digit':(ch===' '||ch==='　'?'space':'ui');
   if(k==='space'){if(cur){out.push([kind,cur]);cur='';kind=''};out.push(['space',ch]);continue}
   if(k!==kind&&cur){out.push([kind,cur]);cur=''}
   kind=k;cur+=ch;
  }
  if(cur)out.push([kind,cur]);return out;
 }

 function uiMask(text){
  const key='u:'+text;if(cache.has(key))return cache.get(key);
  const family='"BIZ UDPGothic", Meiryo, sans-serif';
  let px=100;TEST.font=`700 ${px}px ${family}`;let m=TEST.measureText(text),h0=(m.actualBoundingBoxAscent||80)+(m.actualBoundingBoxDescent||18);px*=86/Math.max(1,h0);
  TEST.font=`700 ${px}px ${family}`;m=TEST.measureText(text);const asc=m.actualBoundingBoxAscent||px*.8,desc=m.actualBoundingBoxDescent||px*.18,left=Math.max(0,m.actualBoundingBoxLeft||0),right=Math.max(m.width,m.actualBoundingBoxRight||m.width);
  const H=112,pad=6,W=Math.max(8,Math.ceil(left+right+pad*2)),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.font=`700 ${px}px ${family}`;x.textBaseline='alphabetic';x.fillStyle='#fff';const y=(H-(asc+desc))/2+asc;x.fillText(text,pad+left,y);
  const r={mask:c.toDataURL('image/png'),w:W/H};cache.set(key,r);return r;
 }

 function digitMask(text){
  const key='d:'+text;if(cache.has(key))return cache.get(key);
  const family='"Roboto Condensed", Arial Narrow, sans-serif';
  let px=100;TEST.font=`700 ${px}px ${family}`;let sm=TEST.measureText('0123456789'),h0=(sm.actualBoundingBoxAscent||75)+(sm.actualBoundingBoxDescent||18);px*=86/Math.max(1,h0);TEST.font=`700 ${px}px ${family}`;
  let cell=0,asc=0,desc=0;for(const d of '0123456789'){const m=TEST.measureText(d);cell=Math.max(cell,m.width);asc=Math.max(asc,m.actualBoundingBoxAscent||px*.75);desc=Math.max(desc,m.actualBoundingBoxDescent||px*.18)}cell=Math.ceil(cell+8);const colon=Math.ceil(cell*.42),H=112,W=Math.max(8,[...text].reduce((n,ch)=>n+(ch===':'?colon:cell),0));
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.font=`700 ${px}px ${family}`;x.textBaseline='alphabetic';x.textAlign='center';x.fillStyle='#fff';const y=(H-(asc+desc))/2+asc;let pos=0;for(const ch of text){const cw=ch===':'?colon:cell;x.fillText(ch,pos+cw/2,y);pos+=cw}
  const r={mask:c.toDataURL('image/png'),w:W/H};cache.set(key,r);return r;
 }

 function maskSpan(kind,text){const r=kind==='digit'?digitMask(text):uiMask(text),s=document.createElement('span');s.className='img-run';s.style.setProperty('--mask',`url("${r.mask}")`);s.style.setProperty('--iw',`${r.w.toFixed(4)}em`);s.setAttribute('aria-hidden','true');return s}
 function convert(node){if(!node.parentElement||SKIP.has(node.parentElement.tagName)||node.parentElement.closest('.imgtext'))return;const text=node.nodeValue;if(!text||!text.trim())return;const wrap=document.createElement('span');wrap.className='imgtext';wrap.setAttribute('role','img');wrap.setAttribute('aria-label',text.trim());for(const [kind,run] of splitRuns(text)){if(kind==='space'){const sp=document.createElement('span');sp.className='img-space';sp.setAttribute('aria-hidden','true');wrap.appendChild(sp)}else wrap.appendChild(maskSpan(kind,run))}node.replaceWith(wrap)}
 function scan(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!n.parentElement||SKIP.has(n.parentElement.tagName)||n.parentElement.closest('.imgtext'))return NodeFilter.FILTER_REJECT;return n.nodeValue&&n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}}),nodes=[];while(w.nextNode())nodes.push(w.currentNode);nodes.forEach(convert)}
 function start(){if(active)return;active=true;scan(document.body);new MutationObserver(ms=>{for(const m of ms){for(const n of m.addedNodes){if(n.nodeType===Node.TEXT_NODE)convert(n);else if(n.nodeType===Node.ELEMENT_NODE&&!n.closest('.imgtext'))scan(n)}}}).observe(document.body,{childList:true,subtree:true})}
 const ready=document.fonts?Promise.all([document.fonts.load('700 100px "BIZ UDPGothic"'),document.fonts.load('700 100px "Roboto Condensed"')]):Promise.resolve();Promise.race([ready,new Promise(r=>setTimeout(r,1600))]).then(start);
})();
</script>
'''
          s=s.replace('</body>',image_text+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit rebuilt UI
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add izuni.html
          git diff --cached --quiet && exit 0
          git commit -m 'Rebuild izuni bright balanced UI'
          git push
