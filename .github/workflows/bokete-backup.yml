name: Bokete emergency backup

on:
  push:
    branches:
      - bokete-backup-20260930
    paths:
      - ".github/workflows/bokete-backup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OUT_DIR: bokete_backup
      MAX_PAGES: "250000"
      MAX_ASSETS: "500000"
      MAX_SECONDS: "3300"
      WORKERS: "12"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout preservation branch
        uses: actions/checkout@v4

      - name: Install crawler dependencies
        run: |
          python -m pip install --disable-pip-version-check -q requests beautifulsoup4 brotli

      - name: Crawl bokete
        id: crawl
        continue-on-error: true
        run: |
          mkdir -p bokete_backup/logs
          python tools/bokete_backup.py 2>&1 | tee bokete_backup/logs/crawler.log

      - name: Direct fallback capture
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p bokete_backup/fallback
          count="$(find bokete_backup/site -type f 2>/dev/null | wc -l)"
          echo "crawler files: $count"
          if [ "$count" -lt 100 ]; then
            wget \
              --recursive --level=8 \
              --convert-links --adjust-extension --page-requisites \
              --domains=bokete.jp,www.bokete.jp,select.bokete.jp \
              --directory-prefix=bokete_backup/fallback \
              --timeout=20 --tries=2 \
              --user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36" \
              https://bokete.jp/ \
              https://bokete.jp/boke/popular \
              https://bokete.jp/boke/hot \
              https://bokete.jp/boke/rising \
              https://bokete.jp/boke/new \
              https://bokete.jp/boke/pickup \
              https://bokete.jp/odai/new \
              https://bokete.jp/odai/popular \
              https://bokete.jp/tag \
              https://bokete.jp/ranking \
              https://select.bokete.jp/ \
              https://select.bokete.jp/boke/popular \
              https://select.bokete.jp/boke/hot \
              https://select.bokete.jp/boke/pickup || true
          fi

      - name: Preserve public archive indexes
        if: always()
        continue-on-error: true
        run: |
          mkdir -p bokete_backup/archive_indexes
          curl -L --retry 2 --max-time 120 \
            'https://web.archive.org/cdx/search/cdx?url=bokete.jp/*&output=txt&fl=timestamp,original,statuscode,mimetype&filter=statuscode:200&collapse=urlkey&limit=200000' \
            -o bokete_backup/archive_indexes/wayback_bokete.tsv || true
          curl -L --retry 2 --max-time 120 \
            'https://web.archive.org/cdx/search/cdx?url=select.bokete.jp/*&output=txt&fl=timestamp,original,statuscode,mimetype&filter=statuscode:200&collapse=urlkey&limit=200000' \
            -o bokete_backup/archive_indexes/wayback_select.tsv || true

      - name: Final inventory
        if: always()
        run: |
          {
            echo "created_utc=$(date -u +%FT%TZ)"
            echo "files=$(find bokete_backup -type f | wc -l)"
            echo "bytes=$(du -sb bokete_backup | cut -f1)"
            echo "html=$(find bokete_backup -type f \( -name '*.html' -o -name '*.htm' \) | wc -l)"
            echo "images=$(find bokete_backup -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.gif' -o -name '*.webp' \) | wc -l)"
          } | tee bokete_backup/INVENTORY.txt
          tar -I 'zstd -3 -T0' -cf bokete_backup.tar.zst bokete_backup
          split -b 1900m -d -a 3 bokete_backup.tar.zst bokete_backup.tar.zst.part-
          rm bokete_backup.tar.zst
          ls -lh bokete_backup.tar.zst.part-* bokete_backup/INVENTORY.txt

      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bokete-backup-2026-09-30
          path: |
            bokete_backup.tar.zst.part-*
            bokete_backup/INVENTORY.txt
            bokete_backup/stats.json
            bokete_backup/manifest.csv
            bokete_backup/errors.csv
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
