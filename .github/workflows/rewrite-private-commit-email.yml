name: Rewrite private commit email
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: privacy-history-rewrite
  cancel-in-progress: false
jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Rewrite and verify all branch histories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --target "$RUNNER_TEMP/privacy-tools" git-filter-repo==2.47.0
          cat > "$RUNNER_TEMP/rewrite-email.py" <<'PY'
          """Rewrite one verified private commit email; verify every snapshot before push."""
          import argparse
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          
          OWNER = "3fes3fes-droid"
          REPOSITORY = OWNER + "/mitsuyasu"
          SAFE_EMAIL = "266936898+3fes3fes-droid@users.noreply.github.com"
          REFERENCE = "0285a99d3d4e23f8e5e8585f677158209386aa93"
          EXPECTED_REFS = {
              "refs/heads/agent/human-ui-sync-20260815",
              "refs/heads/backup/birthday-db-before-ui-20260815",
              "refs/heads/backup/image-generation-v7.5.10-20261001",
              "refs/heads/bokete-backup-20260930",
              "refs/heads/main",
              "refs/heads/tmp-i-one-scrape-20260926",
          }
          
          parser = argparse.ArgumentParser()
          parser.add_argument("repository_path")
          parser.add_argument("--filter-repo", required=True)
          parser.add_argument("--apply", action="store_true")
          args = parser.parse_args()
          repo = Path(args.repository_path).resolve()
          
          def git(*arguments, data=None):
              result = subprocess.run(
                  ["git", *arguments], cwd=repo, input=data,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False,
              )
              if result.returncode:
                  raise RuntimeError("Git operation failed: " + arguments[0])
              return result.stdout
          
          def refs():
              return dict(line.split(" ", 1) for line in git(
                  "for-each-ref", "--format=%(refname) %(objectname)",
                  "refs/heads", "refs/tags",
              ).decode().splitlines())
          
          def commits():
              ids = git("rev-list", "--all").splitlines()
              stream = git("cat-file", "--batch", data=b"\n".join(ids) + b"\n")
              result, offset = {}, 0
              for expected in ids:
                  end = stream.index(b"\n", offset)
                  sha, kind, size = stream[offset:end].split()
                  assert sha == expected and kind == b"commit", "Invalid commit object"
                  start = end + 1
                  result[sha.decode()] = stream[start:start + int(size)]
                  offset = start + int(size) + 1
              assert offset == len(stream), "Incomplete commit scan"
              return result
          
          def split_commit(raw):
              head, message = raw.split(b"\n\n", 1)
              headers = []
              for line in head.split(b"\n"):
                  if line.startswith(b" "):
                      headers[-1] += b"\n" + line
                  else:
                      headers.append(line)
              return headers, message
          
          old_refs = refs()
          assert set(old_refs) == EXPECTED_REFS, "Repository references changed; review required"
          if args.apply:
              assert os.environ.get("GITHUB_REPOSITORY") == REPOSITORY, "Wrong repository"
              assert old_refs["refs/heads/main"] == os.environ["GITHUB_SHA"], "Main changed after workflow launch"
          
          before = commits()
          assert REFERENCE in before, "Verified source commit is missing"
          private_email = git("show", "-s", "--format=%ae", REFERENCE).strip()
          assert git("show", "-s", "--format=%an", REFERENCE).strip() == OWNER.encode(), "Unexpected identity"
          assert private_email and b"@" in private_email and b"noreply" not in private_email, "Unexpected email"
          needle = b"<" + private_email + b">"
          affected = sum(needle in raw.split(b"\n\n", 1)[0] for raw in before.values())
          assert affected > 0, "No matching private email found"
          assert not any(private_email in split_commit(raw)[1] for raw in before.values()), "Email also appears in a commit message; review required"
          
          callback = (
              'import os\n'
              'return b"' + SAFE_EMAIL + '" if email.lower() == '
              'os.environ["REDACT_COMMIT_EMAIL"].encode().lower() else email'
          )
          environment = os.environ.copy()
          environment["REDACT_COMMIT_EMAIL"] = private_email.decode()
          filtered = subprocess.run([
              sys.executable, args.filter_repo, "--force", "--sensitive-data-removal",
              "--no-fetch", "--no-gc", "--preserve-commit-hashes", "--preserve-commit-encoding",
              "--prune-empty", "never", "--prune-degenerate", "never",
              "--email-callback", callback,
          ], cwd=repo, env=environment, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          if filtered.returncode:
              raise RuntimeError("History rewrite failed before publication")
          
          map_path = Path(git("rev-parse", "--git-path", "filter-repo/commit-map").decode().strip())
          if not map_path.is_absolute():
              map_path = repo / map_path
          mapping = dict(line.split() for line in map_path.read_text().splitlines()[1:])
          after = commits()
          assert len(before) == len(after), "Commit count changed"
          assert set(before) <= set(mapping), "Incomplete rewrite map"
          assert len({mapping[sha] for sha in before}) == len(before), "Commits were combined"
          
          signature_headers = (b"gpgsig ", b"gpgsig-sha256 ")
          replacement = b"<" + SAFE_EMAIL.encode() + b">"
          for old, original in before.items():
              new = mapping[old]
              assert new in after, "Rewritten commit is unreachable"
              old_headers, old_message = split_commit(original)
              new_headers, new_message = split_commit(after[new])
              expected = []
              for header in old_headers:
                  if header.startswith(signature_headers):
                      continue
                  if header.startswith(b"parent "):
                      header = b"parent " + mapping[header[7:].decode()].encode()
                  elif header.startswith((b"author ", b"committer ")):
                      header = header.replace(needle, replacement)
                  expected.append(header)
              actual = [header for header in new_headers if not header.startswith(signature_headers)]
              assert expected == actual, "A commit field besides email, parent IDs, or signature changed"
              assert old_message == new_message, "A commit message changed"
              assert private_email not in after[new], "Private email remains in history"
          
          new_refs = refs()
          assert set(new_refs) == set(old_refs), "A branch or tag was added or removed"
          for ref, old in old_refs.items():
              assert new_refs[ref] == mapping[old], "Reference mapping mismatch"
              assert git("rev-parse", old + "^{tree}") == git("rev-parse", new_refs[ref] + "^{tree}"), "File content changed"
          
          pull_refs = git("for-each-ref", "--format=%(refname)", "refs/pull").decode().splitlines()
          report = {
              "commits_verified": len(before),
              "commits_with_private_email": affected,
              "branches_verified": len(old_refs),
              "remaining_private_email": 0,
              "all_file_snapshots_unchanged": True,
              "pull_request_refs_requiring_github_support": len(pull_refs),
              "published": False,
          }
          
          if args.apply:
              leases = ["--force-with-lease=" + ref + ":" + old for ref, old in old_refs.items()]
              updates = [new_refs[ref] + ":" + ref for ref in old_refs]
              git("-c", "remote.origin.mirror=false", "push", "--atomic", *leases,
                  "https://github.com/" + REPOSITORY + ".git", *updates)
              remote = dict((ref, sha) for sha, ref in (line.split() for line in git(
                  "ls-remote", "--heads", "--tags", "https://github.com/" + REPOSITORY + ".git"
              ).decode().splitlines()))
              assert remote == new_refs, "Remote verification failed"
              report["published"] = True
          
          (repo.parent / "privacy-rewrite-report.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("## Commit email rewrite\n\n")
                  summary.write("```json\n" + json.dumps(report, indent=2) + "\n```\n")
          PY
          python3 - <<'PY'
          import base64, os, pathlib, subprocess, sys
          assert os.environ["GITHUB_REPOSITORY"] == "3fes3fes-droid/mitsuyasu"
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          env = os.environ.copy()
          token = env.pop("GH_TOKEN")
          env["GIT_CONFIG_COUNT"] = "1"
          env["GIT_CONFIG_KEY_0"] = "http.https://github.com/.extraheader"
          env["GIT_CONFIG_VALUE_0"] = "AUTHORIZATION: basic " + base64.b64encode(("x-access-token:" + token).encode()).decode()
          env["GIT_TERMINAL_PROMPT"] = "0"
          repo = root / "email-rewrite.git"
          subprocess.run(["git", "clone", "--mirror", "https://github.com/3fes3fes-droid/mitsuyasu.git", str(repo)], env=env, check=True)
          subprocess.run([sys.executable, str(root / "rewrite-email.py"), str(repo), "--filter-repo", str(root / "privacy-tools/git_filter_repo.py"), "--apply"], env=env, check=True)
          PY
