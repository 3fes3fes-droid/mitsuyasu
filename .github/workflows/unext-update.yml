name: U-NEXT database update

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "Maximum number of new titles to fetch in this run"
        required: false
        default: "1000"
  push:
    paths:
      - "un.py"
      - ".github/workflows/unext-update.yml"

permissions:
  contents: write

concurrency:
  group: unext-database-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Update U-NEXT database
        env:
          MAX_ITEMS: ${{ inputs.max_items || '1000' }}
          MAX_RUNTIME_MINUTES: "300"
          SAVE_EVERY: "25"
          REQUEST_TIMEOUT: "30"
        run: python un.py

      - name: Commit updated database
        shell: bash
        run: |
          if git diff --quiet -- unext.json; then
            echo "unext.json has no changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unext.json
          git commit -m "Update U-NEXT database"
          git pull --rebase origin main
          git push origin HEAD:main
