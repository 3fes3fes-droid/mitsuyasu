name: U-NEXT database update

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "Maximum new titles in this run (0 = unlimited)"
        required: false
        default: "1000"
      max_runtime_minutes:
        description: "Stop cleanly after this many minutes (0 = unlimited)"
        required: false
        default: "300"

  push:
    paths:
      - "unext_run_trigger.txt"

permissions:
  contents: write

# 同じDBを2本同時に更新させない。
concurrency:
  group: unext-database-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Update U-NEXT database
        env:
          MAX_ITEMS: ${{ inputs.max_items }}
          MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes }}
          SAVE_EVERY: "100"
          REQUEST_TIMEOUT: "30"
          MAX_SID_RETRIES: "3"
          REQUEST_INTERVAL: "0.8"
        run: python un.py

      - name: Commit database and crawl state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # unext_state.json は初回は未追跡なので、git diff ではなく先に add する。
          git add -A -- unext.json unext_state.json

          if git diff --cached --quiet; then
            echo "No database/state changes"
            exit 0
          fi

          git commit -m "Update U-NEXT database"
          git pull --rebase origin main
          git push origin HEAD:main
