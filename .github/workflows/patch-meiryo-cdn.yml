name: Patch izuni actual Meiryo image text

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-meiryo-cdn.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Patch izuni
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, json, os, urllib.request

          raw='https://raw.githubusercontent.com/3fes3fes-droid/mitsuyasu/main/izuni.html'
          with urllib.request.urlopen(raw) as r:
              s=r.read().decode('utf-8')

          old='<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">'
          new='<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">\n<link href="https://db.onlinewebfonts.com/c/a332acaf781c7cd772622c8d44c40bc7?family=Meiryo+W53+Bold" rel="stylesheet">'
          s=s.replace(old,new)
          if 'a332acaf781c7cd772622c8d44c40bc7' not in s:
              s=s.replace('</title>','</title>\n<link href="https://db.onlinewebfonts.com/c/a332acaf781c7cd772622c8d44c40bc7?family=Meiryo+W53+Bold" rel="stylesheet">',1)

          s=s.replace('font-family:"BIZ UDPGothic",Meiryo,"Yu Gothic",sans-serif','font-family:"Meiryo W53 Bold",Meiryo,"Yu Gothic",sans-serif')
          s=s.replace('const family=\'"BIZ UDPGothic", Meiryo, sans-serif\'','const family=\'"Meiryo W53 Bold", Meiryo, sans-serif\'')
          s=s.replace('document.fonts.load(\'700 100px "BIZ UDPGothic"\')','document.fonts.load(\'700 100px "Meiryo W53 Bold"\')')
          s=s.replace('"BIZ UDPGothic", Meiryo, sans-serif','"Meiryo W53 Bold", Meiryo, sans-serif')
          s=s.replace('"BIZ UDPGothic",Meiryo','"Meiryo W53 Bold",Meiryo')

          # Remove any remaining BIZ webfont reference. Japanese text is rasterized from actual Meiryo W53 Bold.
          s=s.replace('BIZ UDPGothic','Meiryo W53 Bold')

          headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'izuni-meiryo-patcher'
          }
          api='https://api.github.com/repos/3fes3fes-droid/mitsuyasu/contents/izuni.html?ref=main'
          req=urllib.request.Request(api,headers=headers)
          with urllib.request.urlopen(req) as r:
              meta=json.load(r)
          body=json.dumps({
              'message':'Render Japanese UI text as actual Meiryo images',
              'content':base64.b64encode(s.encode('utf-8')).decode('ascii'),
              'sha':meta['sha'],
              'branch':'main'
          }).encode()
          req=urllib.request.Request('https://api.github.com/repos/3fes3fes-droid/mitsuyasu/contents/izuni.html',data=body,headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req) as r:
              print(r.status)
