name: Bokete sharded rescue
on:
  push:
    branches: [main]
    paths: [".github/workflows/bokete-sharded-rescue.yml"]
permissions:
  actions: read
  contents: read
jobs:
  rescue:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OUT_DIR: bokete_rescue
      SEED_FILE: retry_urls.txt
      SEEDS_ONLY: "1"
      DISCOVER_PAGES: "0"
      RETRY_ATTEMPTS: "2"
      MAX_PAGES: "5000"
      MAX_ASSETS: "30000"
      MAX_SECONDS: "720"
      WORKERS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Download pass 1 artifact
        uses: actions/download-artifact@v4
        with:
          name: bokete-backup-2026-09-30
          path: prev
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36706126361
      - name: Build shard seed list
        run: |
          cat prev/bokete_backup.tar.zst.part-* > /tmp/pass1.tar.zst
          mkdir /tmp/pass1
          tar --zstd -xf /tmp/pass1.tar.zst -C /tmp/pass1
          python - <<'PY'
          import csv, os
          from urllib.parse import urlsplit
          from pathlib import Path
          shard=int(os.environ['SHARD'])
          candidates=[]
          with open('/tmp/pass1/bokete_backup/errors.csv',encoding='utf-8-sig') as f:
              for r in csv.DictReader(f):
                  u=r.get('url',''); e=r.get('error','')
                  h=(urlsplit(u).hostname or '').lower()
                  path=urlsplit(u).path.lower()
                  asset_ext=('.jpg','.jpeg','.png','.gif','.webp','.svg','.ico','.css','.js','.mjs','.woff','.woff2','.ttf','.otf','.mp4','.webm','.mp3','.wav','.pdf')
                  if h in {'bokete.jp','www.bokete.jp','select.bokete.jp'} and not path.endswith(asset_ext) and ('HTTP 5' in e or 'timeout' in e.lower() or 'connection' in e.lower()):
                      candidates.append(u)
          candidates=list(dict.fromkeys(candidates))
          mine=[u for i,u in enumerate(candidates) if i%4==shard]
          Path('retry_urls.txt').write_text('\n'.join(mine)+'\n',encoding='utf-8')
          print('all pages',len(candidates),'this shard',len(mine))
          PY
        env:
          SHARD: ${{ matrix.shard }}
      - name: Get crawler
        run: |
          curl -fsSL "https://raw.githubusercontent.com/3fes3fes-droid/mitsuyasu/bokete-backup-20260930/tools/bokete_backup.py" -o /tmp/bokete_backup.py
          python -m pip install --disable-pip-version-check -q requests beautifulsoup4 brotli
      - name: Rescue pages
        continue-on-error: true
        run: python /tmp/bokete_backup.py 2>&1 | tee bokete_rescue_shard.log
      - name: Package shard
        if: always()
        run: |
          mkdir -p bokete_rescue
          cp retry_urls.txt bokete_rescue/retry_urls_shard_${{ matrix.shard }}.txt || true
          cp bokete_rescue_shard.log bokete_rescue/ || true
          {
            echo "shard=${{ matrix.shard }}"
            echo "files=$(find bokete_rescue -type f | wc -l)"
            echo "bytes=$(du -sb bokete_rescue | cut -f1)"
            echo "html=$(find bokete_rescue/site -type f -name '*.html' 2>/dev/null | wc -l)"
          } | tee bokete_rescue/SHARD_INVENTORY.txt
      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bokete-rescue-shard-${{ matrix.shard }}
          path: bokete_rescue/
          retention-days: 90
          compression-level: 0
          if-no-files-found: warn
