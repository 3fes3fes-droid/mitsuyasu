name: Rasterize izuni UI with Meiryo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meiryo-rasterize.yml'

permissions:
  contents: write

jobs:
  rasterize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Meiryo glyph images into HTML
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $families = [System.Drawing.FontFamily]::Families | ForEach-Object { $_.Name }
          if ($families -notcontains 'Meiryo') { throw 'Meiryo font is not installed on this Windows runner.' }

          $path = 'izuni.html'
          $html = Get-Content $path -Raw -Encoding UTF8

          # Keep the numeric display font, remove the substitute Japanese font.
          $html = $html -replace '<link href="https://fonts.googleapis.com/css2\?family=BIZ\+UDPGothic:wght@700&family=Roboto\+Condensed:wght@700&display=swap" rel="stylesheet">', '<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">'
          $html = $html -replace 'font-family:"BIZ UDPGothic",Meiryo,"Yu Gothic",sans-serif', 'font-family:Meiryo,"Yu Gothic",sans-serif'

          # Collect every Japanese glyph used by the UI strings, plus printable ASCII and symbols.
          $set = New-Object 'System.Collections.Generic.HashSet[char]'
          foreach ($m in [regex]::Matches($html, '[ぁ-んァ-ヶ一-龯々ー・／（）→←]')) { [void]$set.Add($m.Value[0]) }
          for ($i=33; $i -le 126; $i++) { [void]$set.Add([char]$i) }
          foreach ($c in @('　','→','←','／','・','（','）','ー')) { [void]$set.Add([char]$c) }

          $font = New-Object System.Drawing.Font('Meiryo', 88, [System.Drawing.FontStyle]::Bold, [System.Drawing.GraphicsUnit]::Pixel)
          $fmt = New-Object System.Drawing.StringFormat([System.Drawing.StringFormat]::GenericTypographic)
          $fmt.FormatFlags = $fmt.FormatFlags -bor [System.Drawing.StringFormatFlags]::MeasureTrailingSpaces
          $probe = New-Object System.Drawing.Bitmap(4,4)
          $pg = [System.Drawing.Graphics]::FromImage($probe)
          $pg.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit

          $em = $font.FontFamily.GetEmHeight($font.Style)
          $asc = $font.FontFamily.GetCellAscent($font.Style)
          $desc = $font.FontFamily.GetCellDescent($font.Style)
          $ascentPx = $font.Size * $asc / $em
          $descentPx = $font.Size * $desc / $em
          $H = 112
          $baseline = ($H - ($ascentPx + $descentPx)) / 2 + $ascentPx
          $originY = $baseline - $ascentPx

          $map = [ordered]@{}
          foreach ($ch in ($set | Sort-Object)) {
            $txt = [string]$ch
            $size = $pg.MeasureString($txt, $font, 1000, $fmt)
            $W = [Math]::Max(18, [Math]::Ceiling($size.Width) + 8)
            $bmp = New-Object System.Drawing.Bitmap($W,$H,[System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::Transparent)
            $g.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit
            $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
            $g.DrawString($txt,$font,$brush,4,$originY,$fmt)
            $ms = New-Object System.IO.MemoryStream
            $bmp.Save($ms,[System.Drawing.Imaging.ImageFormat]::Png)
            $b64 = [Convert]::ToBase64String($ms.ToArray())
            $map[$txt] = [ordered]@{ d = "data:image/png;base64,$b64"; w = [Math]::Round($W / $H,4) }
            $ms.Dispose(); $brush.Dispose(); $g.Dispose(); $bmp.Dispose()
          }
          $pg.Dispose(); $probe.Dispose(); $font.Dispose(); $fmt.Dispose()

          $json = $map | ConvertTo-Json -Compress -Depth 4
          $replacement = @"
<script>
(()=>{
 const MEIRYO=$json;
 const SKIP=new Set(['SCRIPT','STYLE','SVG','PATH','META','LINK','TITLE','CANVAS']);
 const digitCache=new Map();let active=false;
 const TEST=document.createElement('canvas').getContext('2d');
 function splitRuns(text){const out=[];let cur='',kind='';for(const ch of text){const k=/[0-9:]/.test(ch)?'digit':(ch===' '||ch==='　'?'space':'ui');if(k==='space'){if(cur){out.push([kind,cur]);cur='';kind=''}out.push(['space',ch]);continue}if(k!==kind&&cur){out.push([kind,cur]);cur=''}kind=k;cur+=ch}if(cur)out.push([kind,cur]);return out}
 function digitMask(text){const key='d:'+text;if(digitCache.has(key))return digitCache.get(key);const family='"Roboto Condensed", Arial Narrow, sans-serif';let px=100;TEST.font=`700 ${px}px ${family}`;let sm=TEST.measureText('0123456789'),h0=(sm.actualBoundingBoxAscent||75)+(sm.actualBoundingBoxDescent||18);px*=86/Math.max(1,h0);TEST.font=`700 ${px}px ${family}`;let cell=0,asc=0,desc=0;for(const d of '0123456789'){const m=TEST.measureText(d);cell=Math.max(cell,m.width);asc=Math.max(asc,m.actualBoundingBoxAscent||px*.75);desc=Math.max(desc,m.actualBoundingBoxDescent||px*.18)}cell=Math.ceil(cell+8);const colon=Math.ceil(cell*.42),H=112,W=Math.max(8,[...text].reduce((n,ch)=>n+(ch===':'?colon:cell),0)),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.font=`700 ${px}px ${family}`;x.textBaseline='alphabetic';x.textAlign='center';x.fillStyle='#fff';const y=(H-(asc+desc))/2+asc;let pos=0;for(const ch of text){const cw=ch===':'?colon:cell;x.fillText(ch,pos+cw/2,y);pos+=cw}const r={mask:c.toDataURL('image/png'),w:W/H};digitCache.set(key,r);return r}
 function runSpan(mask,w){const s=document.createElement('span');s.className='img-run';s.style.setProperty('--mask',`url("${mask}")`);s.style.setProperty('--iw',`${Number(w).toFixed(4)}em`);s.setAttribute('aria-hidden','true');return s}
 function uiSpan(ch){const r=MEIRYO[ch];if(!r){const s=document.createElement('span');s.textContent=ch;return s}return runSpan(r.d,r.w)}
 function convert(node){if(!node.parentElement||SKIP.has(node.parentElement.tagName)||node.parentElement.closest('.imgtext'))return;const text=node.nodeValue;if(!text||!text.trim())return;const wrap=document.createElement('span');wrap.className='imgtext';wrap.setAttribute('role','img');wrap.setAttribute('aria-label',text.trim());for(const [kind,run] of splitRuns(text)){if(kind==='space'){const sp=document.createElement('span');sp.className='img-space';sp.setAttribute('aria-hidden','true');wrap.appendChild(sp)}else if(kind==='digit'){const r=digitMask(run);wrap.appendChild(runSpan(r.mask,r.w))}else{for(const ch of run)wrap.appendChild(uiSpan(ch))}}node.replaceWith(wrap)}
 function scan(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!n.parentElement||SKIP.has(n.parentElement.tagName)||n.parentElement.closest('.imgtext'))return NodeFilter.FILTER_REJECT;return n.nodeValue&&n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}}),nodes=[];while(w.nextNode())nodes.push(w.currentNode);nodes.forEach(convert)}
 function start(){if(active)return;active=true;scan(document.body);new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===Node.TEXT_NODE)convert(n);else if(n.nodeType===Node.ELEMENT_NODE&&!n.closest('.imgtext'))scan(n)}}).observe(document.body,{childList:true,subtree:true})}
 const ready=document.fonts?document.fonts.load('700 100px "Roboto Condensed"'):Promise.resolve();Promise.race([ready,new Promise(r=>setTimeout(r,1200))]).then(start);
})();
</script>

</body>
"@

          $pattern = '(?s)<script>\s*\(\(\)=>\{\s*const SKIP=.*?</script>\s*</body>'
          if (-not [regex]::IsMatch($html,$pattern)) { throw 'Existing image-text script block was not found.' }
          $html = [regex]::Replace($html,$pattern,[System.Text.RegularExpressions.MatchEvaluator]{ param($m) $replacement },1)
          [System.IO.File]::WriteAllText((Resolve-Path $path),$html,(New-Object System.Text.UTF8Encoding($false)))
      - name: Commit and push
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add izuni.html
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Use actual Meiryo raster glyphs in izuni'
          git push
