name: Import archived YouTube thumbnails

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-tube-thumbnails
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify archives and place images under tube by channel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, zipfile
          from pathlib import Path
          channels = {
              'kodoku-ajito': ('孤独アジト', 51, 1157770, 'f9478b1b7df98085ed3b23abf7066efddd17e558b04139fe313f541ec11caad4'),
              'teamy-official': ('声優三姉妹【チームY】', 826, 14512730, '52d269c20cf89649ae91d74841529ebac89f63837283d100bf9646a636399c53'),
              'tokyo-cabastory': ('東京キャバストーリー', 274, 5816412, '43db78be1de0990d3a20af825e7fa52e6caf57ac95411d8a552539e9ce630116'),
              'wbj-anime': ('ワーナー公式アニメ', 1452, 18498354, 'b3d31047f08e8d9e14eddb483e1a8c4c3255ab5d62921b1b5313334b75249f90'),
          }
          files = []
          for slug, (name, count, size, digest) in channels.items():
              archive = Path('tube-upload-' + slug + '.zip')
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == digest, str(archive)
              with zipfile.ZipFile(archive) as z:
                  entries = z.infolist()
                  assert len(entries) == count
                  assert len({info.filename for info in entries}) == count
                  assert sum(info.file_size for info in entries) == size
                  for info in entries:
                      assert re.fullmatch(r'tube/' + re.escape(slug) + r'/[A-Za-z0-9_-]{11}\.jpg', info.filename), info.filename
                      data = z.read(info)
                      target = Path(info.filename)
                      if target.exists():
                          assert target.read_bytes() == data, 'Different image already exists: ' + str(target)
                      else:
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(data)
                      files.append({'path': info.filename, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          assert len(files) == 2603
          assert sum(row['bytes'] for row in files) == 39985266
          manifest = {'source': 'mitsuyasu-memory', 'thumbnail_count': len(files), 'thumbnail_bytes': sum(row['bytes'] for row in files), 'files': files}
          Path('tube/manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          readme = ['# YouTubeサムネイル保管庫', '', 'mitsuyasu-memoryから移したサムネイル画像。元の画質・ファイル名を保持。', '', '| チャンネル | フォルダ | 枚数 |', '|---|---|---:|']
          for slug, (name, count, size, digest) in channels.items():
              readme.append(f'| {name} | [{slug}](./{slug}/) | {count:,} |')
          readme.extend(['', '合計：2,603枚、39,985,266 bytes。', '', 'サイトは次の形式で画像を参照します。', '', '`https://raw.githubusercontent.com/3fes3fes-droid/mitsuyasu/main/tube/<チャンネルID>/<動画ID>.jpg`', '', '画像ごとのSHA-256とサイズは `manifest.json` に記録しています。', ''])
          Path('tube/README.md').write_text('\n'.join(readme), encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('Verified and imported 2,603 thumbnails (39,985,266 bytes) into tube/channel folders.\n')
          PY
      - name: Commit imported images with private identity
        shell: bash
        env:
          GIT_AUTHOR_NAME: 3fes3fes-droid
          GIT_AUTHOR_EMAIL: 266936898+3fes3fes-droid@users.noreply.github.com
          GIT_COMMITTER_NAME: 3fes3fes-droid
          GIT_COMMITTER_EMAIL: 266936898+3fes3fes-droid@users.noreply.github.com
        run: |
          set -euo pipefail
          git add -- tube
          git rm -- tube-upload-kodoku-ajito.zip tube-upload-teamy-official.zip tube-upload-tokyo-cabastory.zip tube-upload-wbj-anime.zip
          python3 - <<'PY'
          import subprocess
          temporary = {'tube-upload-kodoku-ajito.zip', 'tube-upload-teamy-official.zip', 'tube-upload-tokyo-cabastory.zip', 'tube-upload-wbj-anime.zip'}
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          assert all(not p or p.startswith('tube/') or p in temporary for p in paths)
          PY
          git commit -m "Archive 2603 YouTube thumbnails under tube by channel"
          git push origin HEAD:main
