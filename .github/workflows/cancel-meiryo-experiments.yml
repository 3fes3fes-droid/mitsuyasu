name: Cancel obsolete Meiryo experiment runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-meiryo-experiments.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 35028486740 35028990927 35029206413 35029513027 35029715965; do
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/3fes3fes-droid/mitsuyasu/actions/runs/$id/cancel" || true
          done
