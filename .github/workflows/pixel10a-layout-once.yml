name: Pixel 10a izuni rebuild

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pixel10a-layout-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Pixel 10a layout and top-time text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('izuni.html')
          s=p.read_text(encoding='utf-8')
          a=s.index('/* Pixel 10a portrait layout:')
          b=s.index('@media(min-width:700px)', a)
          block='''/* Pixel 10a portrait layout: 1080x2424 proportions */
@media (max-width:430px) and (orientation:portrait){
 html,body{width:100%;max-width:100%;overflow-x:hidden}
 body{padding-bottom:calc(5.56vw + env(safe-area-inset-bottom))}
 header{padding:2.22vw max(2.22vw,env(safe-area-inset-right)) 1.85vw max(2.22vw,env(safe-area-inset-left))}
 .top-card{border-radius:3.33vw;padding:2.22vw;gap:1.67vw 2.78vw}
 .top-times{overflow:visible}
 .top-direct{font-size:8.6vw;line-height:1;letter-spacing:-.15vw}
 .countdown-num{font-size:7.4vw}
 .countdown-label{font-size:3.15vw}
 .clock{font-size:4.55vw}
 .status-row{margin-top:1.6vw;font-size:2.9vw}
 .tabs{padding:1.67vw 2.22vw 1.85vw}
 .tab-row{gap:1.11vw;margin-bottom:1.11vw}
 .tab{width:100%;height:15.74vw;padding:.55vw .74vw;font-size:4.63vw;grid-template-columns:minmax(0,1fr) 4.17vw minmax(0,1fr);gap:0}
 .tab-side{overflow:hidden}
 .tab-side .imgtext{max-width:100%;overflow:hidden}
 .tab-side .img-run{max-width:100%}
 .tab-arrow{width:4.17vw;font-size:4.44vw}
 .home-ico{width:7.41vw;height:7.41vw;flex-basis:7.41vw}
 .section{padding:2.22vw 1.67vw 3.33vw}
 .hours-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.67vw}
 .hour-label{width:6.67vw;flex-basis:6.67vw;padding:2.5vw .74vw 0 0;font-size:4.44vw}
 .hour-line{width:.37vw;flex-basis:.37vw;margin:0 1.11vw}
 .minutes{gap:.93vw;padding:.93vw 0 1.48vw}
 .chip{min-width:10.19vw;min-height:10.74vw;padding:.74vw .93vw;border-radius:2.04vw}
 .chip .minute{font-size:5.37vw}
 .journey{padding:2.78vw;border-radius:3.24vw;margin-bottom:2.78vw}
 .timeline{grid-template-columns:17.59vw minmax(0,1fr);column-gap:2.22vw}
 .station-time{font-size:5.37vw;padding:1.85vw 0}
 .station-box{padding:1.85vw 2.22vw;border-radius:2.31vw}
 .station-name{font-size:3.89vw}
 .station-note{font-size:2.69vw}
 .line-time{font-size:2.96vw;padding:1.85vw 0}
 .line-box{padding:1.67vw 2.22vw;font-size:2.96vw;margin-left:2.22vw}
 .transfer-time{font-size:4.63vw;padding:2.04vw 0}
 .transfer-box{padding:1.85vw 2.22vw}
 .detail-actions{gap:1.67vw;margin-top:2.5vw}
 .detail-link{padding:2.31vw 1.67vw;font-size:3.15vw;border-radius:2.04vw}
}

'''
          s=s[:a]+block+s[b:]
          old="times.innerHTML=`<div class=\"top-direct\">${t.dep} 発 → ${t.arr||'--:--'} 着</div>`;"
          new="times.innerHTML=`<div class=\"top-direct\">${t.dep} → ${t.arr||'--:--'}</div>`;"
          if s.count(old)!=1:
              raise SystemExit(f'top-time pattern count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and commit izuni only
        shell: bash
        run: |
          git diff --check -- izuni.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add izuni.html
          git diff --cached --quiet && exit 0
          git commit -m 'Rebuild izuni for Pixel 10a proportions'
          git push
