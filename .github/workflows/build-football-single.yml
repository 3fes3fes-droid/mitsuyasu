name: Build Football single HTML
on:
  push:
    paths:
      - ".github/workflows/build-football-single.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild single HTML
        shell: bash
        run: |
          set -euo pipefail
          cat football-upload/chunk_*.txt | tr -d '\n\r' | base64 --decode > Football_archive_single.html
          test "$(stat -c%s Football_archive_single.html)" = "88834538"
          test "$(sha256sum Football_archive_single.html | awk '{print $1}')" = "16edeccbb3d16660a69de0b37d56909108be9d2561f18d003b70db015cb45ade"

      - name: Commit final HTML and remove staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf football-upload
          rm -f .github/workflows/build-football-single.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add self-contained Football archive HTML"
          git push
