name: wasyaganatv channel thumbnail build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/wasyaganatv-thumbnails.yml"
      - "py/youtube_channel_thumbnails.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Deno for YouTube JS challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install latest yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]"

      - name: Build all non-Shorts embedded thumbnails
        shell: bash
        run: |
          set -o pipefail
          python py/youtube_channel_thumbnails.py \
            "https://www.youtube.com/@wasyaganatv" \
            -o wasyaganatv_all_thumbnails.html \
            --workers 16 | tee wasyaganatv_build.log

      - name: Verify the finished single-file HTML
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("wasyaganatv_all_thumbnails.html")
          assert path.is_file() and path.stat().st_size > 5000, "HTML not produced"
          content = path.read_text(encoding="utf-8")
          ids = re.findall(r'<a class="thumb" href="https://www\.youtube\.com/watch\?v=([\w-]{11})"', content)
          thumbs = content.count('src="data:image/')
          assert len(ids) >= 100, f"Suspiciously few videos: {len(ids)}"
          assert len(ids) == len(set(ids)), "Duplicate video IDs"
          assert len(ids) == thumbs, f"Mismatched IDs/thumbs: {len(ids)} vs {thumbs}"
          assert "i.ytimg.com/vi/" not in content, "External thumbnail dependency"
          log = Path("wasyaganatv_build.log").read_text(encoding="utf-8")
          counts = {}
          for key, pattern in {
            "videos": r"通常動画: (\d+)件",
            "streams": r"配信: (\d+)件",
            "unique": r"重複除去後: (\d+)件",
            "failed": r"取得失敗: (\d+)件"
          }.items():
              matches = re.findall(pattern, log)
              assert matches, f"Missing {key} in log"
              counts[key] = int(matches[-1])
          assert counts["failed"] == 0 and counts["unique"] == len(ids)
          report = {
            "channel_url": "https://www.youtube.com/@wasyaganatv",
            "generated_at_utc": datetime.now(timezone.utc).isoformat(),
            "collection_sources": {"videos": counts["videos"], "streams": counts["streams"], "shorts": "excluded"},
            "unique_video_ids": len(ids),
            "embedded_thumbnails": thumbs,
            "failed_thumbnails": 0,
            "html_size_bytes": path.stat().st_size,
            "complete": True
          }
          Path("wasyaganatv_report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          Path("wasyaganatv_video_ids.txt").write_text("\n".join(ids)+"\n", encoding="utf-8")
          Path("wasyaganatv_failed_ids.txt").write_text("", encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload HTML and verification files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasyaganatv-all-thumbnails
          path: |
            wasyaganatv_all_thumbnails.html
            wasyaganatv_build.log
            wasyaganatv_report.json
            wasyaganatv_video_ids.txt
            wasyaganatv_failed_ids.txt
          if-no-files-found: warn
          retention-days: 7
