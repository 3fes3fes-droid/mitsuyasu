<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U-NEXT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0f1a; color: #e8e8e8; font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; min-height: 100vh; }

  header { background: #0d1525; border-bottom: 1px solid #1e2d45; padding: 0.5rem 1.5rem; position: sticky; top: 0; z-index: 100; }
  header .service-logo {
    display: block;
    width: 112px;
    height: 24px;
    object-fit: contain;
    margin-bottom: 0.4rem;
    filter: brightness(0) invert(1);
  }

  .search-area { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
  .search-area input[type=text] {
    background: #1a2540; border: 1px solid #2a3a5a; color: #e8e8e8;
    padding: 0.35rem 0.6rem; border-radius: 6px; font-size: 0.8rem; width: 240px;
  }
  .search-area input[type=text]:focus { outline: none; border-color: #4a9eff; }
  .search-area input[type=text]::placeholder { color: #556; }

  .filters { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-top: 0.3rem; }
  .filter-label { font-size: 0.72rem; color: #667; }
  .check-group { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .check-group label { display: flex; align-items: center; gap: 0.25rem; font-size: 0.72rem; color: #aab; cursor: pointer; }
  .check-group input[type=checkbox] { accent-color: #4a9eff; width: 11px; height: 11px; }

  select {
    background: #1a2540; border: 1px solid #2a3a5a; color: #e8e8e8;
    padding: 0.3rem 0.5rem; border-radius: 6px; font-size: 0.75rem;
  }

  .btn-search, .btn-clear, .btn-random {
    background: #1e3a5f; border: 1px solid #4a9eff; color: #8fc4ff;
    border-radius: 6px; padding: 0.35rem 0.8rem; font-size: 0.75rem; cursor: pointer;
  }
  .btn-search:hover, .btn-clear:hover, .btn-random:hover { background: #2a4f7f; }
  .btn-clear { border-color: #3a4a66; color: #aab; background: #152038; }
  .btn-random { border-color: #315780; background: #172b47; }
  .btn-random:disabled { opacity: 0.55; cursor: wait; }

  .stats { padding: 0.5rem 1.5rem; font-size: 0.75rem; color: #73839a; border-bottom: 1px solid #1a2535; scroll-margin-top: 110px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    padding: 12px 16px;
    width: 100%;
  }

  @media (max-width: 1200px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .grid { padding: 10px; }
  }

  .card {
    background: #0d1525;
    border: 1px solid #1e2d45;
    border-radius: 8px;
    overflow: hidden;
    min-width: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .card:hover {
    background: #111c30;
    border-color: #315780;
  }

  .thumb-link {
    display: block;
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #131d2e;
    overflow: hidden;
    text-decoration: none;
  }
  .thumb-link img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.2s ease;
  }
  .card:hover .thumb-link img { transform: scale(1.025); }
  .thumb-link .no-img {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #46536a;
    font-size: 11px;
  }

  .genre-badge {
    position: absolute;
    top: 6px;
    left: 6px;
    z-index: 2;
    background: rgba(74, 158, 255, 0.9);
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
  }

  .card-body {
    padding: 8px 10px 6px;
    min-width: 0;
  }
  .title-link {
    display: block;
    color: #e8e8e8;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .title-link:hover {
    color: #8fc4ff;
    text-decoration: underline;
  }
  .card-year {
    margin-top: 3px;
    color: #66758b;
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card-cast {
    margin-top: 6px;
    color: #8b98aa;
    font-size: 11px;
    line-height: 1.65;
    max-height: 3.3em;
    overflow: hidden;
  }
  .cast-name {
    appearance: none;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    line-height: inherit;
    padding: 0;
    margin: 0;
    cursor: pointer;
  }
  .cast-name:hover {
    color: #4a9eff;
    text-decoration: underline;
  }
  .cast-separator { color: #526075; }

  .detail-wrap { padding: 0 10px 9px; }
  .btn-detail {
    display: block;
    width: 100%;
    background: #172b47;
    border: 1px solid #315780;
    color: #8fc4ff;
    border-radius: 5px;
    padding: 5px 0;
    font-size: 11px;
    cursor: pointer;
    text-align: center;
  }
  .btn-detail:hover { background: #203d63; }

  .empty { text-align: center; padding: 4rem; color: #445; }
  .highlight { background: rgba(74,158,255,0.25); border-radius: 2px; }


  /* モーダル */
  .overlay {
    display: none; position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.8);
    z-index: 200; align-items: center; justify-content: center;
  }
  .overlay.active { display: flex; }

  .modal {
    background: #0d1525; border: 1px solid #2a3f60; border-radius: 10px;
    width: 96%; max-width: 860px; max-height: 88vh;
    overflow-y: auto; padding: 28px;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
  .modal-title { font-size: 22px; font-weight: 500; color: #e8e8e8; }
  .modal-meta { font-size: 14px; color: #556; margin-top: 5px; }
  .btn-close { background: none; border: none; color: #556; font-size: 28px; cursor: pointer; line-height: 1; }
  .btn-close:hover { color: #aaa; }

  .trailer-link {
    display: inline-block; margin-bottom: 20px;
    background: #1a0a0a; border: 1px solid #ff4444;
    color: #ff7070; font-size: 14px; padding: 7px 18px;
    border-radius: 5px; text-decoration: none;
  }
  .trailer-link:hover { background: #2a1010; }

  .section-label { font-size: 12px; letter-spacing: 0.06em; margin-bottom: 8px; margin-top: 18px; }
  .label-gemini { color: #4a9eff; }
  .label-wiki   { color: #8888ff; }

  .gemini-box {
    background: #071828; border-left: 2px solid #4a9eff;
    border-radius: 0 6px 6px 0; padding: 16px;
    font-size: 15px; color: #bbc; line-height: 2; white-space: pre-wrap;
  }
  .gemini-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .gemini-btn {
    background: #1e3a5f; border: 1px solid #4a9eff; color: #8fc4ff;
    border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  .gemini-btn:hover { background: #2a4f7f; }
  .prompt-note { color: #889; font-size: 13px; line-height: 1.7; margin-bottom: 10px; white-space: normal; }
  .prompt-preview {
    background: #06111f; border: 1px solid #163050; border-radius: 6px;
    padding: 10px; color: #889; font-size: 12px; line-height: 1.7;
    max-height: 180px; overflow-y: auto; white-space: pre-wrap;
  }
  .copy-status { color: #4a9eff; font-size: 13px; margin-top: 8px; white-space: normal; }
  .wiki-box {
    background: #07071a; border-left: 2px solid #6666cc;
    border-radius: 0 6px 6px 0; padding: 16px;
    font-size: 15px; color: #99a; line-height: 2;
  }
  .loading-text { color: #4a9eff; font-size: 14px; }
  .unknown-text { color: #ff6666; font-size: 16px; font-weight: 500; }
</style>
</head>
<body>

<header>
  <img class="service-logo" src="https://www.unext.co.jp/logo/unext-type.svg" alt="">
  <div class="search-area">
    <input type="text" id="keyword" placeholder="キーワード検索" oninput="scheduleSearch()" onkeydown="if(event.key==='Enter') startSearch()">
    <select id="genre_filter" onchange="scheduleSearch()">
      <option value="">ジャンル：すべて</option>
      <option value="バラエティ">バラエティ</option>
      <option value="ドラマ">ドラマ</option>
      <option value="映画">映画</option>
      <option value="アニメ">アニメ</option>
      <option value="ドキュメンタリー">ドキュメンタリー</option>
      <option value="スポーツ">スポーツ</option>
      <option value="音楽">音楽</option>
    </select>
    <select id="sort" onchange="handleSortChange()">
      <option value="year_desc">新しい順</option>
      <option value="year_asc">古い順</option>
      <option value="title">タイトル順</option>
    </select>
    <button class="btn-search" onclick="startSearch()">検索</button>
    <button class="btn-clear" onclick="clearSearch()">クリア</button>
    <button class="btn-random" id="randomBtn" onclick="showRandomItems(true)">🎲 ランダム</button>
  </div>
  <div class="filters">
    <span class="filter-label">検索対象：</span>
    <div class="check-group">
      <label><input type="checkbox" id="chk_title" checked onchange="scheduleSearch()"> タイトル</label>
      <label><input type="checkbox" id="chk_cast" checked onchange="scheduleSearch()"> 出演者</label>
      <label><input type="checkbox" id="chk_story" checked onchange="scheduleSearch()"> あらすじ</label>
      <label><input type="checkbox" id="chk_director" onchange="scheduleSearch()"> 監督</label>
      <label><input type="checkbox" id="chk_staff" onchange="scheduleSearch()"> スタッフ</label>
    </div>
  </div>
</header>

<div class="stats" id="stats">読み込み中...</div>
<div class="grid" id="grid"></div>

<!-- モーダル -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-meta" id="modal-meta"></div>
      </div>
      <button class="btn-close" onclick="closeModal()">×</button>
    </div>

    <a id="trailer-link" class="trailer-link" target="_blank" rel="noopener">▶ YouTube で予告を見る</a>

    <div class="section-label label-gemini">通常Geminiで詳細あらすじを聞く</div>
    <div class="gemini-box" id="gemini-result"></div>

    <div class="section-label label-wiki">Wikipedia あらすじ</div>
    <div class="wiki-box" id="wiki-result"><span class="loading-text">取得中...</span></div>
  </div>
</div>

<script>
let _debounceTimer = null;
let currentModalData = null;

// GitHub Pages上で、このHTMLと同じフォルダにある unext.json を直接読む。
// server.py と /api/unext は使用しない。
const DATA_FILE_URL = new URL('./unext.json', document.baseURI);
const SEARCH_RESULT_LIMIT = 200;
const RANDOM_PICK_COUNT = 100;

const VIEW_RANDOM = 'random';
const VIEW_SEARCH = 'search';
const VIEW_CAST = 'cast';

let _allItemsCache = null;
let _dataLoadPromise = null;
let currentViewMode = VIEW_RANDOM;
let activeCastName = '';
let currentRandomItems = [];

function normalizeText(value) {
  if (Array.isArray(value)) return value.join(' ');
  if (value === null || value === undefined) return '';
  if (typeof value === 'object') return Object.values(value).join(' ');
  return String(value);
}

function normalizeSearchText(value) {
  return normalizeText(value).normalize('NFKC').toLocaleLowerCase('ja-JP').trim();
}

function escapeHTML(text) {
  return String(text || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeRegExp(text) {
  return String(text).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlight(text, keyword) {
  const source = normalizeText(text);
  const kw = normalizeText(keyword);
  if (!kw) return escapeHTML(source);

  const parts = source.split(new RegExp(`(${escapeRegExp(kw)})`, 'gi'));
  return parts.map((part, index) =>
    index % 2 === 1
      ? `<span class="highlight">${escapeHTML(part)}</span>`
      : escapeHTML(part)
  ).join('');
}

function extractItemsFromJson(json) {
  if (Array.isArray(json)) return json;

  if (!json || typeof json !== 'object') {
    throw new Error('unext.json のトップ階層が配列またはオブジェクトではありません');
  }

  for (const candidate of [json.items, json.data, json.results, json.works, json.titles]) {
    if (Array.isArray(candidate)) return candidate;
  }

  // 実際のunext.json形式：{ "SID...": {作品データ}, ... }
  const values = Object.values(json).filter(value =>
    value && typeof value === 'object' && !Array.isArray(value)
  );

  if (values.length > 0) return values;
  if (Object.keys(json).length === 0) return [];
  throw new Error('unext.json 内に作品データを見つけられません');
}

async function loadAllItems(forceReload = false) {
  if (_allItemsCache && !forceReload) return _allItemsCache;
  if (_dataLoadPromise && !forceReload) return _dataLoadPromise;

  _dataLoadPromise = (async () => {
    const response = await fetch(DATA_FILE_URL);
    const responseText = await response.text();

    if (!response.ok) {
      throw new Error(`unext.json を取得できません（HTTP ${response.status}）\n取得先: ${DATA_FILE_URL.href}`);
    }

    const trimmed = responseText.replace(/^\uFEFF/, '').trimStart();
    if (trimmed.startsWith('<')) {
      throw new Error(`unext.json の取得先からJSONではなくHTMLが返りました。\n取得先: ${DATA_FILE_URL.href}`);
    }

    let json;
    try {
      json = JSON.parse(responseText);
    } catch (error) {
      throw new Error(`unext.json のJSON解析に失敗しました: ${error.message}\n取得先: ${DATA_FILE_URL.href}`);
    }

    const sourceItems = extractItemsFromJson(json);
    const seen = new Set();
    _allItemsCache = sourceItems.filter(item => {
      if (!item || typeof item !== 'object') return false;
      const key = normalizeText(item.id || item.url || `${item.title || ''}__${item.year || ''}`);
      if (!key || seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    return _allItemsCache;
  })();

  try {
    return await _dataLoadPromise;
  } catch (error) {
    _allItemsCache = null;
    throw error;
  } finally {
    _dataLoadPromise = null;
  }
}

function getSortableYear(value) {
  const match = normalizeText(value).match(/\d{4}/);
  return match ? Number(match[0]) : -1;
}

function sortItems(items, sort) {
  const sorted = items.slice();

  if (sort === 'year_asc') {
    sorted.sort((a, b) =>
      getSortableYear(a.year) - getSortableYear(b.year) ||
      normalizeText(a.title).localeCompare(normalizeText(b.title), 'ja')
    );
  } else if (sort === 'title') {
    sorted.sort((a, b) =>
      normalizeText(a.title).localeCompare(normalizeText(b.title), 'ja', {
        numeric: true,
        sensitivity: 'base'
      })
    );
  } else {
    sorted.sort((a, b) =>
      getSortableYear(b.year) - getSortableYear(a.year) ||
      normalizeText(a.title).localeCompare(normalizeText(b.title), 'ja')
    );
  }

  return sorted;
}

function genreMatches(itemGenre, selectedGenre) {
  if (!selectedGenre) return true;
  const genre = normalizeText(itemGenre);

  if (selectedGenre === '映画') {
    return genre.includes('映画') || genre === '邦画' || genre === '洋画';
  }
  if (selectedGenre === 'ドラマ') {
    return genre.includes('ドラマ');
  }
  return genre.includes(selectedGenre);
}

function sampleRandom(items, count) {
  const result = items.slice();
  const take = Math.min(count, result.length);
  for (let i = 0; i < take; i++) {
    const j = i + Math.floor(Math.random() * (result.length - i));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result.slice(0, take);
}

function getSelectedSearchFields() {
  const fields = [];
  if (document.getElementById('chk_title').checked) fields.push('title');
  if (document.getElementById('chk_cast').checked) fields.push('cast');
  if (document.getElementById('chk_story').checked) fields.push('story');
  if (document.getElementById('chk_director').checked) fields.push('director');
  if (document.getElementById('chk_staff').checked) fields.push('staff');
  return fields;
}

function scheduleSearch() {
  currentViewMode = VIEW_SEARCH;
  activeCastName = '';
  clearTimeout(_debounceTimer);
  _debounceTimer = setTimeout(() => renderCurrentView(false), 300);
}

function startSearch() {
  clearTimeout(_debounceTimer);
  currentViewMode = VIEW_SEARCH;
  activeCastName = '';
  renderCurrentView(true);
}

function handleSortChange() {
  if (currentViewMode === VIEW_RANDOM) return;
  renderCurrentView(false);
}

function clearSearch() {
  clearTimeout(_debounceTimer);
  document.getElementById('keyword').value = '';
  document.getElementById('genre_filter').value = '';
  activeCastName = '';
  showRandomItems(true);
}

async function showRandomItems(forceNew = false) {
  clearTimeout(_debounceTimer);
  currentViewMode = VIEW_RANDOM;
  activeCastName = '';
  document.getElementById('keyword').value = '';
  document.getElementById('genre_filter').value = '';

  const button = document.getElementById('randomBtn');
  button.disabled = true;
  document.getElementById('stats').textContent = 'ランダム作品を読み込み中...';

  try {
    const allItems = await loadAllItems();
    if (forceNew || currentRandomItems.length === 0) {
      currentRandomItems = sampleRandom(allItems, RANDOM_PICK_COUNT);
    }
    drawCards(currentRandomItems, '');
    document.getElementById('stats').textContent =
      `ランダム ${currentRandomItems.length} 件 ／ 全 ${allItems.length} 件`;
  } catch (error) {
    showLoadError(error);
  } finally {
    button.disabled = false;
  }
}

async function renderCurrentView(scrollToResults = false) {
  if (currentViewMode === VIEW_RANDOM) {
    await showRandomItems(false);
    if (scrollToResults) scrollResultsIntoView();
    return;
  }

  const keyword = document.getElementById('keyword').value.trim();
  const genre = document.getElementById('genre_filter').value;
  const sort = document.getElementById('sort').value;
  const stats = document.getElementById('stats');
  stats.textContent = '検索中...';

  try {
    const allItems = await loadAllItems();
    let filtered;
    let label;
    let highlightKeyword = keyword;

    if (currentViewMode === VIEW_CAST && activeCastName) {
      const target = normalizeSearchText(activeCastName);
      filtered = allItems.filter(item =>
        Array.isArray(item.cast) && item.cast.some(name => normalizeSearchText(name) === target)
      );
      label = `出演者「${activeCastName}」`;
      highlightKeyword = activeCastName;
    } else {
      const normalizedKeyword = normalizeSearchText(keyword);
      const fields = getSelectedSearchFields();

      filtered = allItems.filter(item => {
        if (!genreMatches(item.genre, genre)) return false;
        if (!normalizedKeyword) return true;
        if (fields.length === 0) return false;
        return fields.some(field => normalizeSearchText(item[field]).includes(normalizedKeyword));
      });

      label = [genre ? `【${genre}】` : '', keyword ? `「${keyword}」` : ''].filter(Boolean).join(' ');
    }

    filtered = sortItems(filtered, sort);
    const total = filtered.length;
    const visibleItems = filtered.slice(0, SEARCH_RESULT_LIMIT);
    drawCards(visibleItems, highlightKeyword);

    stats.textContent =
      `${label ? label + ' ' : ''}${total} 件` +
      (total > SEARCH_RESULT_LIMIT ? `（先頭 ${SEARCH_RESULT_LIMIT} 件を表示）` : '');

    if (scrollToResults) scrollResultsIntoView();
  } catch (error) {
    showLoadError(error);
  }
}

function scrollResultsIntoView() {
  document.getElementById('stats').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function showLoadError(error) {
  const message = error instanceof Error ? error.message : String(error);
  document.getElementById('stats').textContent =
    `エラー: ${message}。このHTMLと同じフォルダに unext.json を置き、GitHub PagesのURLから開いてください。`;
  document.getElementById('grid').innerHTML = '';
}

function buildCardElement(item, highlightKeyword) {
  const card = document.createElement('article');
  card.className = 'card';

  const title = normalizeText(item.title) || 'タイトル不明';
  const unextUrl = normalizeText(item.url);
  const youtubeUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(title)}`;

  // サムネイルだけU-NEXTを開く。
  const thumbLink = document.createElement('a');
  thumbLink.className = 'thumb-link';
  thumbLink.href = unextUrl || '#';
  thumbLink.target = '_blank';
  thumbLink.rel = 'noopener';
  thumbLink.title = 'U-NEXTで開く';
  if (!unextUrl) thumbLink.addEventListener('click', event => event.preventDefault());

  if (item.thumbnail) {
    const image = document.createElement('img');
    image.src = item.thumbnail;
    image.alt = title;
    image.loading = 'lazy';
    image.addEventListener('error', () => {
      const noImage = document.createElement('div');
      noImage.className = 'no-img';
      noImage.textContent = 'NO IMAGE';
      thumbLink.replaceChildren(noImage);
    });
    thumbLink.appendChild(image);
  } else {
    const noImage = document.createElement('div');
    noImage.className = 'no-img';
    noImage.textContent = 'NO IMAGE';
    thumbLink.appendChild(noImage);
  }

  if (item.genre) {
    const badge = document.createElement('span');
    badge.className = 'genre-badge';
    badge.textContent = item.genre;
    thumbLink.appendChild(badge);
  }

  const body = document.createElement('div');
  body.className = 'card-body';

  // タイトルだけYouTube検索を開く。
  const titleLink = document.createElement('a');
  titleLink.className = 'title-link';
  titleLink.href = youtubeUrl;
  titleLink.target = '_blank';
  titleLink.rel = 'noopener';
  titleLink.title = `YouTubeで「${title}」を検索`;
  titleLink.innerHTML = highlight(title, highlightKeyword);
  body.appendChild(titleLink);

  const year = document.createElement('div');
  year.className = 'card-year';
  year.innerHTML = `${highlight(item.year, highlightKeyword)}${item.country ? `　${escapeHTML(item.country)}` : ''}`;
  body.appendChild(year);

  const castList = Array.isArray(item.cast) ? item.cast.filter(Boolean) : [];
  if (castList.length > 0) {
    const castBox = document.createElement('div');
    castBox.className = 'card-cast';

    castList.forEach((rawName, index) => {
      const name = normalizeText(rawName);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'cast-name';
      button.innerHTML = highlight(name, highlightKeyword);
      button.title = `${name}の出演作品に絞り込む`;
      button.addEventListener('click', event => searchCast(event, name));
      castBox.appendChild(button);

      if (index < castList.length - 1) {
        const separator = document.createElement('span');
        separator.className = 'cast-separator';
        separator.textContent = '・';
        castBox.appendChild(separator);
      }
    });

    body.appendChild(castBox);
  }

  const detailWrap = document.createElement('div');
  detailWrap.className = 'detail-wrap';
  const detailButton = document.createElement('button');
  detailButton.type = 'button';
  detailButton.className = 'btn-detail';
  detailButton.textContent = '▶ 詳細あらすじ';
  detailButton.addEventListener('click', () => {
    openModal({
      title,
      year: normalizeText(item.year),
      director: Array.isArray(item.director) ? item.director.join(' / ') : normalizeText(item.director)
    });
  });
  detailWrap.appendChild(detailButton);

  card.appendChild(thumbLink);
  card.appendChild(body);
  card.appendChild(detailWrap);
  return card;
}

function drawCards(items, highlightKeyword) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  if (items.length === 0) {
    grid.innerHTML = '<div class="empty">該当する作品が見つかりません</div>';
    return;
  }

  const fragment = document.createDocumentFragment();
  items.forEach(item => fragment.appendChild(buildCardElement(item, highlightKeyword)));
  grid.appendChild(fragment);
}

function searchCast(event, name) {
  event.preventDefault();
  event.stopPropagation();

  clearTimeout(_debounceTimer);
  currentViewMode = VIEW_CAST;
  activeCastName = name;
  document.getElementById('keyword').value = name;
  document.getElementById('genre_filter').value = '';
  document.getElementById('chk_cast').checked = true;
  renderCurrentView(true);
}

// --- モーダル ---
function openModal(data) {
  currentModalData = data;
  document.getElementById('modal-title').textContent = data.title;
  document.getElementById('modal-meta').textContent =
    `${data.year}${data.director ? ' · ' + data.director : ''}`;
  document.getElementById('trailer-link').href =
    `https://www.youtube.com/results?search_query=${encodeURIComponent(data.title + ' 予告')}`;
  document.getElementById('gemini-result').innerHTML = buildGeminiBox(data);
  document.getElementById('wiki-result').innerHTML   = '<span class="loading-text">Wikipedia を取得中...</span>';
  document.getElementById('overlay').classList.add('active');
  fetchWiki(data.title);
}

function closeModal() {
  document.getElementById('overlay').classList.remove('active');
}

document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function makeGeminiPrompt(data) {
  return `映画「${data.title}」(${data.year}年)について以下の形式で答えよ。

ルール：
- この映画が知識にない・情報が不十分な場合は「不明」の一言だけ返せ
- 他の作品の情報で補完するな
- 知っている事実のみ書け。推測・補完禁止
- 文章で書け。箇条書き禁止
- ネタバレあり、結末まで書け
- 原作・漫画・他作品の情報で補完するな

【基本情報】監督・公開年・製作国を1行で
【概要】2行
【序盤】3行
【中盤】3行
【結末】3行
【見どころ】1行`;
}

function buildGeminiBox(data) {
  const prompt = makeGeminiPrompt(data);
  return `
    <div class="prompt-note">
      APIは使わず、通常のGeminiを別タブで開きます。<br>
      ボタンを押すと下の質問文をコピーしてGeminiを開くので、Gemini側に貼り付けて聞いてください。
    </div>
    <div class="gemini-actions">
      <button class="gemini-btn" onclick="openGeminiNormal()">通常Geminiを開く＋質問文コピー</button>
      <button class="gemini-btn" onclick="copyGeminiPrompt()">質問文だけコピー</button>
    </div>
    <div class="prompt-preview">${escapeHTML(prompt)}</div>
    <div class="copy-status" id="copy-status"></div>`;
}

async function copyTextToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(text);
    return true;
  }

  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  const ok = document.execCommand('copy');
  document.body.removeChild(ta);
  return ok;
}

async function copyGeminiPrompt() {
  if (!currentModalData) return;
  const status = document.getElementById('copy-status');
  const prompt = makeGeminiPrompt(currentModalData);
  try {
    const ok = await copyTextToClipboard(prompt);
    status.textContent = ok
      ? '質問文をコピーしました。'
      : 'コピーできませんでした。上の質問文を手動でコピーしてください。';
  } catch(e) {
    status.textContent = 'コピーできませんでした。上の質問文を手動でコピーしてください。';
  }
}

async function openGeminiNormal() {
  if (!currentModalData) return;

  const geminiWindow = window.open('https://gemini.google.com/app', '_blank', 'noopener');
  await copyGeminiPrompt();

  const status = document.getElementById('copy-status');
  if (status) {
    status.textContent += geminiWindow
      ? ' 通常Geminiを開きました。Gemini側に貼り付けて聞いてください。'
      : ' 通常Geminiを開けませんでした。ポップアップブロックを確認してください。';
  }
}

async function fetchWiki(title) {
  const el = document.getElementById('wiki-result');
  try {
    const searchRes = await fetch(
      `https://ja.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(title)}&format=json&origin=*`
    );
    const searchJson = await searchRes.json();
    const pages = searchJson?.query?.search;
    if (!pages || pages.length === 0) { el.textContent = '情報なし'; return; }

    const pageTitle = pages[0].title;
    const sectRes = await fetch(
      `https://ja.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(pageTitle)}&prop=sections&format=json&origin=*`
    );
    const sectJson = await sectRes.json();
    const sections = sectJson?.parse?.sections || [];
    const targetNames = ['あらすじ', 'ストーリー', '物語', '概要'];
    const sect = sections.find(s => targetNames.includes(s.line));

    if (!sect) { el.textContent = 'Wikipediaにあらすじセクションなし'; return; }

    const textRes = await fetch(
      `https://ja.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(pageTitle)}&prop=wikitext&section=${sect.index}&format=json&origin=*`
    );
    const textJson = await textRes.json();
    let wikiText = textJson?.parse?.wikitext?.['*'] || '';
    wikiText = wikiText
      .replace(/\[\[([^\]|]+\|)?([^\]]+)\]\]/g, '$2')
      .replace(/{{[^}]+}}/g, '')
      .replace(/'{2,3}/g, '')
      .replace(/<[^>]+>/g, '')
      .replace(/==.*?==/g, '')
      .trim();

    el.textContent = wikiText || '情報なし';
  } catch(e) {
    el.textContent = 'Wikipedia取得エラー';
  }
}
