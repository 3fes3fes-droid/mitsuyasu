<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U-NEXT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0f1a; color: #e8e8e8; font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; min-height: 100vh; }

  header { background: #0d1525; border-bottom: 1px solid #1e2d45; padding: 0.5rem 1.5rem; position: sticky; top: 0; z-index: 100; }
  header .service-logo {
    display: block;
    width: 112px;
    height: 24px;
    object-fit: contain;
    margin-bottom: 0.4rem;
    filter: brightness(0) invert(1);
  }

  .search-area { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
  .search-area input[type=text] {
    background: #1a2540; border: 1px solid #2a3a5a; color: #e8e8e8;
    padding: 0.35rem 0.6rem; border-radius: 6px; font-size: 0.8rem; width: 240px;
  }
  .search-area input[type=text]:focus { outline: none; border-color: #4a9eff; }
  .search-area input[type=text]::placeholder { color: #556; }

  .filters { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-top: 0.3rem; }
  .filter-label { font-size: 0.72rem; color: #667; }
  .check-group { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .check-group label { display: flex; align-items: center; gap: 0.25rem; font-size: 0.72rem; color: #aab; cursor: pointer; }
  .check-group input[type=checkbox] { accent-color: #4a9eff; width: 11px; height: 11px; }

  select {
    background: #1a2540; border: 1px solid #2a3a5a; color: #e8e8e8;
    padding: 0.3rem 0.5rem; border-radius: 6px; font-size: 0.75rem;
  }

  .btn-search, .btn-clear {
    background: #1e3a5f; border: 1px solid #4a9eff; color: #8fc4ff;
    border-radius: 6px; padding: 0.35rem 0.8rem; font-size: 0.75rem; cursor: pointer;
  }
  .btn-search:hover, .btn-clear:hover { background: #2a4f7f; }
  .btn-clear { border-color: #3a4a66; color: #aab; background: #152038; }

  .stats { padding: 0.5rem 1.5rem; font-size: 0.75rem; color: #556; border-bottom: 1px solid #1a2535; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1rem;
    padding: 1rem 1.5rem;
  }

  .card {
    background: #0d1525; border: 1px solid #1e2d45; border-radius: 8px;
    overflow: hidden; transition: transform 0.15s, border-color 0.15s;
    text-decoration: none; color: inherit; display: block;
  }
  .card:hover { transform: translateY(-3px); border-color: #4a9eff; }

  .thumb-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #131d2e; overflow: hidden; }
  .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-wrap .no-img { display: flex; align-items: center; justify-content: center; height: 100%; color: #334; font-size: 0.7rem; }

  .genre-badge {
    position: absolute; top: 6px; left: 6px;
    background: rgba(74,158,255,0.85); color: #fff;
    font-size: 0.65rem; padding: 2px 6px; border-radius: 3px;
  }

  .card-body { padding: 0.6rem 0.75rem 0.75rem; }
  .card-title { font-size: 0.85rem; font-weight: 500; line-height: 1.4; margin-bottom: 0.3rem;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card-year { font-size: 0.7rem; color: #556; margin-bottom: 0.4rem; }
  .card-cast { font-size: 0.7rem; color: #889; line-height: 1.6; margin-bottom: 0.5rem; }

  .btn-detail {
    display: block; width: 100%; background: #1e3a5f;
    border: 1px solid #4a9eff; color: #4a9eff;
    border-radius: 5px; padding: 5px 0; font-size: 11px;
    cursor: pointer; text-align: center;
  }
  .btn-detail:hover { background: #2a4f7f; }

  .empty { text-align: center; padding: 4rem; color: #445; }
  .highlight { background: rgba(74,158,255,0.25); border-radius: 2px; }
  .cast-name { cursor: pointer; border-radius: 3px; padding: 0 1px; transition: color 0.1s; }
  .cast-name:hover { color: #4a9eff; text-decoration: underline; }

  /* ランダムピックアップ */
  .random-pick { padding: 1rem 1.5rem; border-bottom: 1px solid #1a2535; }
  .random-pick-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem; }
  .random-pick-label { font-size: 0.8rem; color: #4a9eff; letter-spacing: 0.04em; }
  .btn-random {
    background: #1e3a5f; border: 1px solid #4a9eff; color: #8fc4ff;
    border-radius: 6px; padding: 6px 16px; font-size: 0.78rem; cursor: pointer;
  }
  .btn-random:hover { background: #2a4f7f; }
  .btn-random:disabled { opacity: 0.5; cursor: default; }
  .random-pick-body {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1rem;
  }
  .random-pick-body .empty { grid-column: 1 / -1; text-align: center; padding: 1.5rem 0; font-size: 0.78rem; }

  /* モーダル */
  .overlay {
    display: none; position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.8);
    z-index: 200; align-items: center; justify-content: center;
  }
  .overlay.active { display: flex; }

  .modal {
    background: #0d1525; border: 1px solid #2a3f60; border-radius: 10px;
    width: 96%; max-width: 860px; max-height: 88vh;
    overflow-y: auto; padding: 28px;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
  .modal-title { font-size: 22px; font-weight: 500; color: #e8e8e8; }
  .modal-meta { font-size: 14px; color: #556; margin-top: 5px; }
  .btn-close { background: none; border: none; color: #556; font-size: 28px; cursor: pointer; line-height: 1; }
  .btn-close:hover { color: #aaa; }

  .trailer-link {
    display: inline-block; margin-bottom: 20px;
    background: #1a0a0a; border: 1px solid #ff4444;
    color: #ff7070; font-size: 14px; padding: 7px 18px;
    border-radius: 5px; text-decoration: none;
  }
  .trailer-link:hover { background: #2a1010; }

  .section-label { font-size: 12px; letter-spacing: 0.06em; margin-bottom: 8px; margin-top: 18px; }
  .label-gemini { color: #4a9eff; }
  .label-wiki   { color: #8888ff; }

  .gemini-box {
    background: #071828; border-left: 2px solid #4a9eff;
    border-radius: 0 6px 6px 0; padding: 16px;
    font-size: 15px; color: #bbc; line-height: 2; white-space: pre-wrap;
  }
  .gemini-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .gemini-btn {
    background: #1e3a5f; border: 1px solid #4a9eff; color: #8fc4ff;
    border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  .gemini-btn:hover { background: #2a4f7f; }
  .prompt-note { color: #889; font-size: 13px; line-height: 1.7; margin-bottom: 10px; white-space: normal; }
  .prompt-preview {
    background: #06111f; border: 1px solid #163050; border-radius: 6px;
    padding: 10px; color: #889; font-size: 12px; line-height: 1.7;
    max-height: 180px; overflow-y: auto; white-space: pre-wrap;
  }
  .copy-status { color: #4a9eff; font-size: 13px; margin-top: 8px; white-space: normal; }
  .wiki-box {
    background: #07071a; border-left: 2px solid #6666cc;
    border-radius: 0 6px 6px 0; padding: 16px;
    font-size: 15px; color: #99a; line-height: 2;
  }
  .loading-text { color: #4a9eff; font-size: 14px; }
  .unknown-text { color: #ff6666; font-size: 16px; font-weight: 500; }
</style>
</head>
<body>

<header>
  <img class="service-logo" src="https://www.unext.co.jp/logo/unext-type.svg" alt="">
  <div class="search-area">
    <input type="text" id="keyword" placeholder="キーワード（空欄でもジャンル指定で一覧表示できます）" oninput="render()" onkeydown="if(event.key==='Enter') fetchAndRender()">
    <select id="genre_filter" onchange="render()">
      <option value="">ジャンル：すべて</option>
      <option value="バラエティ">バラエティ</option>
      <option value="ドラマ">ドラマ</option>
      <option value="映画">映画</option>
      <option value="アニメ">アニメ</option>
      <option value="ドキュメンタリー">ドキュメンタリー</option>
      <option value="スポーツ">スポーツ</option>
      <option value="音楽">音楽</option>
    </select>
    <select id="sort" onchange="render()">
      <option value="year_desc">新しい順</option>
      <option value="year_asc">古い順</option>
      <option value="title">タイトル順</option>
    </select>
    <button class="btn-search" onclick="fetchAndRender()">検索</button>
    <button class="btn-clear" onclick="clearSearch()">クリア</button>
  </div>
  <div class="filters">
    <span class="filter-label">検索対象：</span>
    <div class="check-group">
      <label><input type="checkbox" id="chk_title" checked onchange="render()"> タイトル</label>
      <label><input type="checkbox" id="chk_cast" checked onchange="render()"> 出演者</label>
      <label><input type="checkbox" id="chk_story" checked onchange="render()"> あらすじ</label>
      <label><input type="checkbox" id="chk_director" onchange="render()"> 監督</label>
      <label><input type="checkbox" id="chk_staff" onchange="render()"> スタッフ</label>
    </div>
  </div>
</header>

<div class="random-pick">
  <div class="random-pick-header">
    <span class="random-pick-label">ランダムピックアップ</span>
    <button class="btn-random" id="randomBtn" onclick="showRandomItem()">🎲 ランダム表示</button>
  </div>
  <div class="random-pick-body" id="randomPickBody">
    <div class="empty">読み込み中...</div>
  </div>
</div>

<div class="stats" id="stats">読み込み中...</div>
<div class="grid" id="grid"></div>

<!-- モーダル -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-meta" id="modal-meta"></div>
      </div>
      <button class="btn-close" onclick="closeModal()">×</button>
    </div>

    <a id="trailer-link" class="trailer-link" target="_blank" rel="noopener">▶ YouTube で予告を見る</a>

    <div class="section-label label-gemini">通常Geminiで詳細あらすじを聞く</div>
    <div class="gemini-box" id="gemini-result"></div>

    <div class="section-label label-wiki">Wikipedia あらすじ</div>
    <div class="wiki-box" id="wiki-result"><span class="loading-text">取得中...</span></div>
  </div>
</div>

<script>
let _debounceTimer = null;
let currentModalData = null;

// GitHub Pages上で、このHTMLと同じフォルダにある unext.json を直接読む。
// server.py や /api/unext は使用しない。
const DATA_FILE_URL = new URL('./unext.json', window.location.href);
const SEARCH_RESULT_LIMIT = 200;
let _allItemsCache = null;
let _dataLoadPromise = null;

function render() {
  clearTimeout(_debounceTimer);
  _debounceTimer = setTimeout(fetchAndRender, 300);
}

function clearSearch() {
  document.getElementById('keyword').value = '';
  document.getElementById('genre_filter').value = '';
  fetchAndRender();
}

function normalizeText(value) {
  if (Array.isArray(value)) return value.join(' ');
  if (value === null || value === undefined) return '';
  if (typeof value === 'object') return Object.values(value).join(' ');
  return String(value);
}

function normalizeSearchText(value) {
  return normalizeText(value).normalize('NFKC').toLocaleLowerCase('ja-JP');
}

function extractItemsFromJson(json) {
  // 1. JSONのトップ階層がそのまま配列
  if (Array.isArray(json)) return json;

  if (!json || typeof json !== 'object') {
    throw new Error('unext.json のトップ階層が配列またはオブジェクトではありません');
  }

  // 2. items / data などの中に配列がある形式
  const candidates = [
    json.items,
    json.data,
    json.results,
    json.works,
    json.titles
  ];
  for (const candidate of candidates) {
    if (Array.isArray(candidate)) return candidate;
  }

  // 3. server.py が対応していた形式
  //    { "作品ID": {作品データ}, "作品ID": {作品データ}, ... }
  //    キーを捨て、各valueを作品一覧として扱う。
  const values = Object.values(json);
  if (values.length === 0) return [];

  const objectValues = values.filter(
    value => value && typeof value === 'object' && !Array.isArray(value)
  );
  if (objectValues.length > 0) return objectValues;

  throw new Error('unext.json 内に作品オブジェクトを見つけられません');
}

async function loadAllItems(forceReload = false) {
  if (_allItemsCache && !forceReload) return _allItemsCache;
  if (_dataLoadPromise && !forceReload) return _dataLoadPromise;

  _dataLoadPromise = (async () => {
    // 同じフォルダの unext.json を直接読む。
    // 大容量ファイルなので通常のブラウザキャッシュを利用する。
    const requestUrl = new URL(DATA_FILE_URL.href);
    const response = await fetch(requestUrl);
    const responseText = await response.text();

    if (!response.ok) {
      throw new Error(
        `unext.json を取得できません（HTTP ${response.status}）\n取得先: ${DATA_FILE_URL.href}`
      );
    }

    const trimmed = responseText.replace(/^\uFEFF/, '').trimStart();
    if (trimmed.startsWith('<')) {
      throw new Error(
        `unext.json の取得先からJSONではなくHTMLが返りました。\n` +
        `取得先: ${DATA_FILE_URL.href}\n` +
        `HTMLとJSONが同じGitHub Pages公開フォルダにあるか確認してください。`
      );
    }

    let json;
    try {
      json = JSON.parse(responseText);
    } catch (parseError) {
      throw new Error(
        `unext.json のJSON解析に失敗しました: ${parseError.message}\n取得先: ${DATA_FILE_URL.href}`
      );
    }

    const sourceItems = extractItemsFromJson(json);

    // 不正な値と重複を除外する。urlがなければ title + year をキーにする。
    const seen = new Set();
    const items = sourceItems.filter(item => {
      if (!item || typeof item !== 'object') return false;
      const key = item.url || `${item.title || ''}__${item.year || ''}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    _allItemsCache = items;
    return items;
  })();

  try {
    return await _dataLoadPromise;
  } catch (error) {
    _allItemsCache = null;
    throw error;
  } finally {
    _dataLoadPromise = null;
  }
}

function getSortableYear(value) {
  const match = normalizeText(value).match(/\d{4}/);
  return match ? Number(match[0]) : -1;
}

function sortItems(items, sort) {
  const sorted = items.slice();

  if (sort === 'year_asc') {
    sorted.sort((a, b) =>
      getSortableYear(a.year) - getSortableYear(b.year) ||
      normalizeText(a.title).localeCompare(normalizeText(b.title), 'ja')
    );
  } else if (sort === 'title') {
    sorted.sort((a, b) =>
      normalizeText(a.title).localeCompare(normalizeText(b.title), 'ja', {
        numeric: true,
        sensitivity: 'base'
      })
    );
  } else {
    sorted.sort((a, b) =>
      getSortableYear(b.year) - getSortableYear(a.year) ||
      normalizeText(a.title).localeCompare(normalizeText(b.title), 'ja')
    );
  }

  return sorted;
}

async function fetchAndRender() {
  const kw    = document.getElementById('keyword').value.trim();
  const genre = document.getElementById('genre_filter').value;
  const sort  = document.getElementById('sort').value;
  const fields = [];
  if (document.getElementById('chk_title').checked)    fields.push('title');
  if (document.getElementById('chk_cast').checked)     fields.push('cast');
  if (document.getElementById('chk_story').checked)    fields.push('story');
  if (document.getElementById('chk_director').checked) fields.push('director');
  if (document.getElementById('chk_staff').checked)    fields.push('staff');

  document.getElementById('stats').textContent = kw || genre ? '検索中...' : '読み込み中...';

  try {
    const allItems = await loadAllItems();

    if (!kw && !genre) {
      document.getElementById('stats').textContent =
        `全 ${allItems.length} 件 ／ キーワードかジャンルを選ぶと一覧表示します`;
      document.getElementById('grid').innerHTML = '';
      return;
    }

    const normalizedKw = normalizeSearchText(kw);
    let filtered = allItems.filter(item => {
      if (genre && normalizeText(item.genre) !== genre) return false;
      if (!normalizedKw) return true;
      if (fields.length === 0) return false;

      return fields.some(field =>
        normalizeSearchText(item[field]).includes(normalizedKw)
      );
    });

    filtered = sortItems(filtered, sort);

    const total = filtered.length;
    const visibleItems = filtered.slice(0, SEARCH_RESULT_LIMIT);
    const genreLabel = genre ? `【${genre}】` : '';

    document.getElementById('stats').textContent =
      `${genreLabel} ${total} 件${total > SEARCH_RESULT_LIMIT ? `（先頭 ${SEARCH_RESULT_LIMIT} 件を表示）` : ''}`;
    drawCards(visibleItems, kw);
  } catch(e) {
    const message = e instanceof Error ? e.message : String(e);
    document.getElementById('stats').textContent =
      message.includes('unext.json') || message.includes('Failed to fetch')
        ? `エラー: ${message}。このHTMLと同じフォルダに unext.json を置き、GitHub Pages のURLから開いてください。`
        : `エラー: ${message}`;
    document.getElementById('grid').innerHTML = '';
  }
}

function highlight(text, kw) {
  if (!kw || !text) return text || '';
  const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return String(text).replace(new RegExp(escaped, 'gi'), m => `<span class="highlight">${m}</span>`);
}

function buildCardElement(d, kw) {
  const card = document.createElement('div');
  card.className = 'card';

  const castList = d.cast || [];
  const castHTML = castList.map((name, i) =>
    `<span class="cast-name" onclick="searchCast(event,'${name.replace(/'/g, "\\'")}')">${highlight(name, kw)}</span>${i < castList.length - 1 ? '・' : ''}`
  ).join('');

  const directorStr = (d.director || []).join(' / ');

  card.innerHTML = `
    <a href="${d.url || '#'}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;display:block;">
      <div class="thumb-wrap">
        ${d.thumbnail
          ? `<img src="${d.thumbnail}" alt="${d.title}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=no-img>NO IMAGE</div>'">`
          : '<div class="no-img">NO IMAGE</div>'}
        ${d.genre ? `<span class="genre-badge">${d.genre}</span>` : ''}
      </div>
      <div class="card-body">
        <div class="card-title">${highlight(d.title, kw)}</div>
        <div class="card-year">${highlight(d.year, kw)} ${d.country || ''}</div>
        ${castHTML ? `<div class="card-cast">${castHTML}</div>` : ''}
      </div>
    </a>
    <div style="padding:0 0.75rem 0.75rem;">
      <button class="btn-detail" onclick="openModal(${JSON.stringify({
        title: d.title,
        year: d.year || '',
        director: directorStr
      }).replace(/"/g, '&quot;')})">▶ 詳細あらすじ</button>
    </div>`;

  return card;
}

function drawCards(items, kw) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (items.length === 0) {
    grid.innerHTML = '<div class="empty">該当する作品が見つかりません</div>';
    return;
  }
  items.forEach(d => grid.appendChild(buildCardElement(d, kw)));
}

// --- ランダムピックアップ ---
const RANDOM_PICK_COUNT = 100;

function sampleRandom(arr, n) {
  const result = arr.slice();
  const len = result.length;
  const count = Math.min(n, len);
  for (let i = 0; i < count; i++) {
    const j = i + Math.floor(Math.random() * (len - i));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result.slice(0, count);
}

async function showRandomItem() {
  const body = document.getElementById('randomPickBody');
  const btn  = document.getElementById('randomBtn');
  btn.disabled = true;
  try {
    const items = await loadAllItems();
    if (items.length === 0) {
      body.innerHTML = '<div class="empty">unext.json に表示できる作品がありません。</div>';
      return;
    }
    const picked = sampleRandom(items, RANDOM_PICK_COUNT);
    body.innerHTML = '';
    picked.forEach(d => body.appendChild(buildCardElement(d, '')));
  } catch(e) {
    const message = e instanceof Error ? e.message : String(e);
    body.innerHTML = `<div class="empty">エラー: ${message}<br>このHTMLと同じフォルダに unext.json を置き、GitHub Pages のURLから開いてください。</div>`;
  } finally {
    btn.disabled = false;
  }
}

function searchCast(e, name) {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById('keyword').value = name;
  fetchAndRender();
}

// --- モーダル ---
function openModal(data) {
  currentModalData = data;
  document.getElementById('modal-title').textContent = data.title;
  document.getElementById('modal-meta').textContent =
    `${data.year}${data.director ? ' · ' + data.director : ''}`;
  document.getElementById('trailer-link').href =
    `https://www.youtube.com/results?search_query=${encodeURIComponent(data.title + ' 予告')}`;
  document.getElementById('gemini-result').innerHTML = buildGeminiBox(data);
  document.getElementById('wiki-result').innerHTML   = '<span class="loading-text">Wikipedia を取得中...</span>';
  document.getElementById('overlay').classList.add('active');
  fetchWiki(data.title);
}

function closeModal() {
  document.getElementById('overlay').classList.remove('active');
}

document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function escapeHTML(text) {
  return String(text || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function makeGeminiPrompt(data) {
  return `映画「${data.title}」(${data.year}年)について以下の形式で答えよ。

ルール：
- この映画が知識にない・情報が不十分な場合は「不明」の一言だけ返せ

function buildGeminiBox(data) {
  const prompt = makeGeminiPrompt(data);
  return `
    <div class="prompt-note">
      APIは使わず、通常のGeminiを別タブで開きます。<br>
      ボタンを押すと下の質問文をコピーしてGeminiを開くので、Gemini側に貼り付けて聞いてください。
    </div>
    <div class="gemini-actions">
      <button class="gemini-btn" onclick="openGeminiNormal()">通常Geminiを開く＋質問文コピー</button>
      <button class="gemini-btn" onclick="copyGeminiPrompt()">質問文だけコピー</button>
    </div>
    <div class="prompt-preview">${escapeHTML(prompt)}</div>
    <div class="copy-status" id="copy-status"></div>`;
}

async function copyTextToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(text);
    return true;
  }

  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  const ok = document.execCommand('copy');
  document.body.removeChild(ta);
  return ok;
}

async function copyGeminiPrompt() {
  if (!currentModalData) return;
  const status = document.getElementById('copy-status');
  const prompt = makeGeminiPrompt(currentModalData);
  try {
    const ok = await copyTextToClipboard(prompt);
    status.textContent = ok
      ? '質問文をコピーしました。'
      : 'コピーできませんでした。上の質問文を手動でコピーしてください。';
  } catch(e) {
    status.textContent = 'コピーできませんでした。上の質問文を手動でコピーしてください。';
  }
}

async function openGeminiNormal() {
  if (!currentModalData) return;

  const geminiWindow = window.open('https://gemini.google.com/app', '_blank', 'noopener');
  await copyGeminiPrompt();

  const status = document.getElementById('copy-status');
  if (status) {
    status.textContent += geminiWindow
      ? ' 通常Geminiを開きました。Gemini側に貼り付けて聞いてください。'
      : ' 通常Geminiを開けませんでした。ポップアップブロックを確認してください。';
  }
}

async function fetchWiki(title) {
  const el = document.getElementById('wiki-result');
  try {
    const searchRes = await fetch(
      `https://ja.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(title)}&format=json&origin=*`
    );
    const searchJson = await searchRes.json();
    const pages = searchJson?.query?.search;
    if (!pages || pages.length === 0) { el.textContent = '情報なし'; return; }

    const pageTitle = pages[0].title;
    const sectRes = await fetch(
      `https://ja.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(pageTitle)}&prop=sections&format=json&origin=*`
    );
    const sectJson = await sectRes.json();
    const sections = sectJson?.parse?.sections || [];
    const targetNames = ['あらすじ', 'ストーリー', '物語', '概要'];
    const sect = sections.find(s => targetNames.includes(s.line));

    if (!sect) { el.textContent = 'Wikipediaにあらすじセクションなし'; return; }

    const textRes = await fetch(
      `https://ja.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(pageTitle)}&prop=wikitext&section=${sect.index}&format=json&origin=*`
    );
    const textJson = await textRes.json();
    let wikiText = textJson?.parse?.wikitext?.['*'] || '';
    wikiText = wikiText
      .replace(/\[\[([^\]|]+\|)?([^\]]+)\]\]/g, '$2')
      .replace(/{{[^}]+}}/g, '')
      .replace(/'{2,3}/g, '')
      .replace(/<[^>]+>/g, '')
      .replace(/==.*?==/g, '')
      .trim();

    el.textContent = wikiText || '情報なし';
  } catch(e) {
    el.textContent = 'Wikipedia取得エラー';
  }
}
